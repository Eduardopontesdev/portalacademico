<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Fisiologia Ilustrada – revisão com imagens</title>
<style>

:root{
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#0f766e; --brand2:#14b8a6; --brand-soft:#ccfbf1;
  --ok:#059669; --ok-soft:#d1fae5; --err:#e11d48; --err-soft:#ffe4e6;
  --o:#2563eb; --o-soft:#dbeafe; --a:#7c3aed; --a-soft:#ede9fe; --warn:#d97706; --warn-soft:#fef3c7;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1220; --card:#131c2e; --text:#e5edf7; --muted:#94a3b8; --line:#243049;
    --brand:#14b8a6; --brand2:#2dd4bf; --brand-soft:#0f2f2c;
    --ok:#34d399; --ok-soft:#08302a; --err:#fb7185; --err-soft:#3a1420;
    --o:#60a5fa; --o-soft:#13243f; --a:#a78bfa; --a-soft:#251c45; --warn:#fbbf24; --warn-soft:#3a2a0a;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}
#app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}

.top{padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 16px;background:linear-gradient(135deg,#0f766e,#115e59 60%,#134e4a);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(15,118,110,.25);flex-shrink:0}
.logo{display:flex;align-items:center;gap:11px}
.logo .ic{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:22px}
.logo h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
.logo p{margin:0;font-size:12px;opacity:.8}
.chip{background:rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}

main{flex:1;overflow-y:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.view{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 8px);flex-shrink:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:14px;color:var(--muted);font-size:11.5px;font-weight:700;position:relative}
.tab .e{font-size:21px;line-height:1.1}
a.tab{text-decoration:none}
.tab.on{color:var(--brand);background:var(--brand-soft)}
.badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--err);color:#fff;border-radius:999px;font-size:10px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 4px 9px;font-weight:800}
h2.sec:first-child{margin-top:4px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

.seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:14px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}

.regions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.region{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:left;box-shadow:var(--shadow);transition:transform .1s}
.region:active{transform:scale(.97)}
.region.all{grid-column:1/-1;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border:0}
.region.vid{grid-column:1/-1;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:0;display:flex;align-items:center;gap:12px}
.region.vid .me{font-size:30px}
.region b{display:block;font-size:15px}
.region small{font-size:12px;color:var(--muted)}
.region.all small,.region.vid small{color:rgba(255,255,255,.88)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:99px;transition:width .3s}
.region.all .bar{background:rgba(255,255,255,.3)}
.region.all .bar i{background:#fff}

.btn{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15.5px;background:var(--brand);color:#fff;margin-top:10px;box-shadow:0 4px 12px rgba(15,118,110,.25)}
.btn.dark{background:var(--text);color:var(--bg);box-shadow:none}
.btn.soft{background:var(--bg);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.warn{background:#f59e0b}
.btn.vio{background:linear-gradient(135deg,#7c3aed,#2563eb)}
.btn:disabled{opacity:.45}
.btn.mini{padding:10px;font-size:14px;margin-top:8px}

/* Quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.x{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px;flex-shrink:0}
.prog{flex:1}
.prog .bar{height:10px;margin:0}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
.pill{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:12px;padding:4px 11px;border-radius:99px;margin-bottom:10px}
.qtext{font-size:17.5px;font-weight:800;margin:4px 0 14px;line-height:1.4}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:11px;align-items:center;text-align:left;padding:12px 13px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px}
.opt .lt{width:28px;height:28px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted);flex-shrink:0}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .lt{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--err);background:var(--err-soft)} .opt.bad .lt{background:var(--err);color:#fff}
textarea.ans{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:15px;outline:none;resize:vertical;min-height:120px}
textarea.ans:focus{border-color:var(--brand)}

.fb{margin-top:14px;border-radius:18px;padding:15px;border:2px solid;animation:in .25s}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--err-soft);border-color:var(--err)}
.fb.neu{background:var(--brand-soft);border-color:var(--brand)}
.fbh{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fbi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex-shrink:0}
.ok .fbi{background:var(--ok)} .bad .fbi{background:var(--err)} .neu .fbi{background:var(--brand)}
.fbh small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.ok .fbh small{color:var(--ok)} .bad .fbh small{color:var(--err)} .neu .fbh small{color:var(--brand)}
.fbh b{font-size:16px;line-height:1.3}
.tip{margin-top:8px;font-size:14px;background:var(--card);border-radius:12px;padding:10px 12px}
.tip small{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.attempt{font-size:13px;color:var(--muted);margin:-2px 0 8px}
.attempt s{color:var(--err);font-weight:700}
.model{background:var(--card);border-left:5px solid var(--brand);border-radius:12px;padding:11px 13px;font-size:14px;margin-top:12px}
.model small{display:block;font-size:11px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.result{text-align:center}
.trophy{font-size:56px;margin:4px 0}
.result h2{margin:0;font-size:24px}
.result p{color:var(--muted);margin:4px 0 14px}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.rs div{border-radius:14px;padding:12px 4px}
.rs b{display:block;font-size:24px}
.rs span{font-size:11px;font-weight:800;text-transform:uppercase}
.brk{text-align:left;margin:10px 0}
.brk div{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;padding:6px 0;border-bottom:1px dashed var(--line)}

.warnmsg{color:var(--warn);font-size:13px;font-weight:700;margin:8px 2px 0}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty .big{font-size:44px}
.banner{display:flex;align-items:center;gap:12px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:16px;padding:12px 14px;margin-bottom:12px;width:100%;text-align:left}
.banner b{display:block;font-size:14px}
.banner small{color:var(--muted)}

/* Estudo */
details.m{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden}
details.m summary{list-style:none;padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.m summary::-webkit-details-marker{display:none}
details.m summary b{flex:1;font-size:15px}
details.m summary::after{content:"›";font-size:22px;color:var(--muted);transition:transform .2s}
details.m[open] summary::after{transform:rotate(90deg)}
.mbody{padding:0 14px 14px;font-size:14.5px}
.mbody ul{margin:6px 0;padding-left:20px}
.mbody li{margin:4px 0}
.mbody p{margin:6px 0}
.kv{background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0}
.tl>div{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.tl b{min-width:50px;color:var(--brand)}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
table.tb th,table.tb td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fml{font-size:16px;font-weight:800;background:var(--brand-soft);color:var(--brand);border-radius:12px;padding:10px 12px;margin:8px 0}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.fields label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin-bottom:4px}
.fields input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px;font-weight:700;outline:none}
.fields input:focus{border-color:var(--brand)}
.steps ol{margin:6px 0;padding-left:20px;font-size:14.5px}
.steps li{margin:6px 0}

/* Player de animação */
.player{margin-top:6px}
.stitle{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;margin-bottom:8px}
.stitle span:last-child{color:var(--muted);font-size:12px}
.screen{background:linear-gradient(180deg,var(--brand-soft),var(--card));border:1px solid var(--line);border-radius:20px;padding:14px;min-height:310px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.scene{animation:in .45s ease-out;display:flex;flex-direction:column;gap:10px}
.cap{text-align:center;font-size:15px;font-weight:600;padding:0 4px}
.vis{width:100%;max-height:215px}
.segs{display:flex;gap:4px;margin:12px 0 8px}
.segs button{flex:1;height:8px;border-radius:9px;background:var(--line);position:relative;overflow:hidden;padding:0}
.segs button i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--brand2)}
.segs button.done i{width:100%}
.segs button.cur i{animation:fillseg var(--d,5s) linear forwards}
@keyframes fillseg{to{width:100%}}
.paused .segs button.cur i,.paused .screen *{animation-play-state:paused!important}
.ctrl{display:flex;gap:10px;justify-content:center;align-items:center}
.cb{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px;box-shadow:var(--shadow)}
.cb.big{width:58px;height:58px;background:var(--brand);color:#fff;font-size:22px;border:0}
.cb.sp{font-size:13px;font-weight:800;width:52px;border-radius:23px}

.sc-body{fill:#334155}.sc-screen{fill:#0f172a}.sc-plate{fill:#94a3b8}
.sc-num{fill:#4ade80;font:700 17px ui-monospace,Menlo,monospace}
.drop{animation:rise 1.8s infinite ease-in}
@keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:.95}100%{transform:translateY(-38px);opacity:0}}
.smoke{transform-box:fill-box;transform-origin:center;animation:rise2 2.4s infinite ease-out}
@keyframes rise2{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.75}100%{transform:translateY(-48px) scale(1.5);opacity:0}}
.glow{animation:glow 1.1s infinite alternate}
@keyframes glow{from{opacity:.5}to{opacity:1}}
.s-dry{animation:dry 3.2s ease forwards}
@keyframes dry{from{fill:#7fb069}to{fill:#c9a46a}}
.s-burn{animation:burn 3.4s ease forwards}
@keyframes burn{from{fill:#7fb069}55%{fill:#3f3f46}to{fill:#9ca3af}}
.pulse{animation:pulse 1s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}

.eqs{display:grid;gap:10px;text-align:center}
.eq{font-size:19px;font-weight:700;opacity:0;animation:fadeup .6s forwards;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px}
.eq.big{background:var(--brand);color:#fff;border:0}
.eq.note{background:var(--warn-soft);border-color:var(--warn);font-size:14px;font-weight:600}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.n-a{color:var(--o)}.n-b{color:var(--a)}.n-r{color:var(--ok)}
.big .n-r,.big .n-a,.big .n-b{color:#fff}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 6px;font-size:.92em}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 8px 2px}
.frac>span:last-child{padding:2px 8px 0}

.res{text-align:center}
.ring{width:140px;height:140px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:conic-gradient(var(--ok) var(--p,100%),var(--line) 0);animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
.ring>div{width:108px;height:108px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:28px;font-weight:800}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.reslabel{font-weight:800;margin:8px 0}
.mbwrap{margin-top:8px}
.mbar{display:flex;height:42px;border-radius:13px;overflow:hidden;border:2px solid var(--line);background:var(--bg)}
.mbar .solid{background:#c9a46a;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.mbar .part{background:#38bdf8;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;animation:growx 1.1s .3s ease-out backwards}
.mbar .part.ash{background:#6b7280}
@keyframes growx{from{width:0}}
.legend{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-top:7px;gap:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;background:#c9a46a}
.legend i.w{background:#38bdf8}.legend i.ash{background:#6b7280}
.mtot{text-align:center;font-size:13px;color:var(--muted);margin-top:4px}


/* ===================== Fisiologia Ilustrada ===================== */
.tabs{grid-template-columns:repeat(3,1fr)}
a.tab{text-decoration:none}
.logo .ic{flex-shrink:0}
@keyframes appear{from{opacity:0}to{opacity:1}}
.appear{opacity:0;animation:appear .5s forwards}
.mono{font-family:ui-monospace,Menlo,monospace}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 10px}
.center{text-align:center}
.backbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13.5px;margin-bottom:12px;box-shadow:var(--shadow)}

/* cartões de tópicos */
.topics{display:grid;gap:11px}
.topic{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);width:100%;transition:transform .1s}
.topic:active{transform:scale(.985)}
.topic .te{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;font-size:29px;flex-shrink:0}
.topic b{display:block;font-size:16.5px}
.topic small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.topic .go{margin-left:auto;font-size:22px;color:var(--muted)}
.topic.t-train{background:linear-gradient(135deg,#7c3aed,#2563eb);border:0;color:#fff}
.topic.t-train small,.topic.t-train .go{color:rgba(255,255,255,.88)}
.topic.t-train .te{background:rgba(255,255,255,.2)}

.legend3{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;font-weight:700;margin:4px 0 8px}
.legend3 i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}

/* coração */
.hsvg{width:100%;display:block}
.tube path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tube .o{stroke-width:21}.tube .i{stroke-width:16}
.tube.hl .o{stroke:#f59e0b}
.tube.hl{filter:drop-shadow(0 0 5px #f59e0b)}
.ch{stroke-width:2.5}
.ch.b{fill:#bfdbfe;stroke:#2563eb}.ch.r{fill:#fecaca;stroke:#dc2626}
.ch.hl{stroke:#f59e0b;stroke-width:4.5;filter:drop-shadow(0 0 6px #f59e0b)}
.vlv{fill:#fbbf24;stroke:#b45309;stroke-width:1.6}
.vlv.hl{fill:#f59e0b;stroke:#7c2d12;stroke-width:2.6;filter:drop-shadow(0 0 5px #f59e0b)}
.lung{fill:#fbcfe8;stroke:#db2777;stroke-width:2}
.lung.hl{stroke:#f59e0b;stroke-width:4;filter:drop-shadow(0 0 6px #f59e0b)}
.cl{font:800 15px system-ui,sans-serif;fill:#0f172a;text-anchor:middle;dominant-baseline:central}
.vl{font:700 8.5px system-ui,sans-serif;fill:#0f172a;text-anchor:middle}
.lbl{font:700 10px system-ui,sans-serif;fill:var(--muted)}
.trail{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-dasharray:1 7;opacity:.9}
.badge{position:static;background:none;border-radius:0;min-width:0;height:auto;padding:0;display:inline}
.nb{fill:#0f172a;stroke:#fff;stroke-width:1.5}
.nt{font:800 10px system-ui,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
.steplist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.steplist li{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13.5px;font-weight:700;cursor:pointer}
.steplist li b{width:24px;height:24px;border-radius:8px;color:#fff;display:grid;place-items:center;font-size:12px;flex-shrink:0}
.steplist li.v b{background:#2563eb}.steplist li.a b{background:#dc2626}
.steplist li span{flex:1}
.steplist li em{font-style:normal;font-size:11.5px;color:var(--muted);font-weight:700}

const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=rnd(i+1);[r[i],r[j]]=[r[j],r[i]];}return r;};
function animateCounts(){}   // (o player chama; aqui não há contadores)

 {id:"circ",e:"🫀",t:"Trajeto do sangue",d:"Da veia cava até a aorta, passo a passo",bg:"linear-gradient(135deg,#bfdbfe,#fca5a5)"},
 {id:"wall",e:"🧱",t:"Camadas do coração",d:"Pericárdio, epicárdio, miocárdio e endocárdio",bg:"linear-gradient(135deg,#fecaca,#fde68a)"},

const HS=[
 {n:"Veias cavas (VCS e VCI)",via:[[84,28],[90,86]],say:"Trazem o sangue <b>venoso</b> (pobre em O₂) do corpo todo até o coração."},

 {n:"Veias pulmonares",via:[[160,22],[208,22],[340,22],[340,82]],say:"Trazem o sangue <b>rico em O₂</b> de volta ao coração (veias que levam sangue arterial)."},

const LAYERS=[
 {id:"fib",n:"Pericárdio fibroso",grp:"Pericárdio (saco ao redor do coração)",c:"#d6b98c",h:30,d:"Camada externa, <b>resistente</b> e fibrosa. Protege o coração e o prende às estruturas vizinhas, limitando a dilatação excessiva."},
 {id:"par",n:"Pericárdio seroso: lâmina parietal",grp:"Pericárdio (saco ao redor do coração)",c:"#fde68a",h:10,d:"Membrana <b>fina</b> que reveste por dentro o pericárdio fibroso."},
 {id:"cav",n:"Cavidade pericárdica",grp:"Pericárdio (saco ao redor do coração)",c:"#bae6fd",h:16,d:"Espaço virtual com um pouco de <b>líquido pericárdico</b>, que lubrifica e reduz o atrito a cada batimento."},
 {id:"epi",n:"Epicárdio",grp:"Parede do coração (3 camadas)",c:"#fcd34d",h:18,d:"<b>Camada externa</b> da parede. É a <b>lâmina visceral</b> do pericárdio seroso. Tem vasos coronários e gordura."},

const CELLS={
 eri:{n:"Hemácia (eritrócito)",grp:"Não é leucócito",pct:"≈ 4–6 milhões/µL",ap:"Disco bicôncavo, <b>sem núcleo</b>, vermelho (hemoglobina).",fn:"Transporta <b>O₂</b> e parte do CO₂."},

 neu:{n:"Neutrófilo",grp:"Granulócito",pct:"≈ 60–70% dos leucócitos",ap:"Núcleo <b>multilobulado</b> (3 a 5 lobos); grânulos finos e pouco corados.",fn:"1ª linha de defesa: <b>fagocita bactérias</b>; forma o pus."},
 lin:{n:"Linfócito",grp:"Agranulócito",pct:"≈ 20–30%",ap:"Pequeno; <b>núcleo grande e redondo</b> ocupando quase toda a célula.",fn:"Imunidade específica: linfócitos <b>B</b> (anticorpos) e <b>T</b>."},

 bas:{n:"Basófilo",grp:"Granulócito",pct:"< 1% (o mais raro)",ap:"Grânulos <b>grandes azul-escuros</b> que escondem o núcleo.",fn:"Libera <b>histamina e heparina</b>: inflamação e alergias."}
};

const LEUCO_PCT={neu:62,lin:30,mon:5,eos:2,bas:0.5};
const LEUCO_COL={neu:"#f9a8d4",lin:"#93c5fd",mon:"#cbd5e1",eos:"#fdba74",bas:"#a78bfa"};

/* Questões de treino */

/* ----- Coração e trajeto do sangue ----- */
function tubeS(d,col,hl){
  const dk=col==="b"?"#2563eb":"#dc2626", lt=col==="b"?"#bfdbfe":"#fecaca";
  return `<g class="tube${hl?" hl":""}"><path class="o" d="${d}" stroke="${dk}"/><path class="i" d="${d}" stroke="${lt}"/></g>`;
}
const BADGE=[[90,84],[72,124],[86,198],[72,222],[140,214],[161,120],[124,15],[340,80],[228,124],[270,197],[290,224],[186,212],[258,70]];
function svgHeart(step,opt){
  const Q=!!(opt&&opt.hide), h=k=>step===k, hc=k=>h(k)?" hl":"";
  let s=`<svg class="hsvg" viewBox="0 0 370 365" role="img" aria-label="Coração e trajeto do sangue">`;
  // câmaras
  s+=`<rect class="ch b${hc(2)}" x="56" y="108" width="92" height="82" rx="30"/><rect class="ch b${hc(4)}" x="56" y="200" width="114" height="104" rx="40"/>`;
  s+=`<rect class="ch r${hc(9)}" x="212" y="108" width="92" height="82" rx="30"/><rect class="ch r${hc(11)}" x="190" y="200" width="114" height="112" rx="44"/>`;
  // pulmões
  s+=`<rect class="lung${hc(7)}" x="112" y="3" width="44" height="40" rx="16"/><rect class="lung${hc(7)}" x="164" y="3" width="44" height="40" rx="16"/>${Q?"":`<text class="vl" x="160" y="36">Pulmões</text>`}`;
  // vasos
  s+=tubeS("M90 52 L90 112","b",h(1))+tubeS("M43 342 L43 170 Q43 160 60 160","b",h(1));
  s+=tubeS("M161 206 L161 44","b",h(6));
  s+=tubeS("M208 22 L340 22 L340 140 L304 140","r",h(8));
  s+=tubeS("M201 206 L201 70 L314 70","r",h(13));
  s+=`<polygon points="328,70 314,61 314,79" fill="${h(13)?"#f59e0b":"#dc2626"}"/>`;
  // válvulas
  s+=`<polygon class="vlv${hc(3)}" points="88,195 102,187 116,195 102,203"/><polygon class="vlv${hc(10)}" points="240,195 254,187 268,195 254,203"/>`;
  s+=`<polygon class="vlv${hc(5)}" points="150,208 161,200 172,208 161,216"/><polygon class="vlv${hc(12)}" points="190,208 201,200 212,208 201,216"/>`;
  // rótulos
  if(!Q) s+=`<text class="cl" x="102" y="150">AD</text><text class="cl" x="113" y="252">VD</text><text class="cl" x="258" y="152">AE</text><text class="cl" x="247" y="254">VE</text>`;
  if(!Q) s+=`<text class="vl" x="102" y="218">tricúspide</text><text class="vl" x="254" y="218">mitral</text><text class="vl" x="140" y="230">pulmonar</text><text class="vl" x="222" y="230">aórtica</text>`;
  if(!Q) s+=`<text class="lbl" x="72" y="64" text-anchor="end">VCS</text><text class="lbl" x="43" y="360" text-anchor="middle">VCI</text><text class="lbl" x="90" y="16" text-anchor="middle">do corpo</text>`;
  if(!Q) s+=`<text class="lbl" x="150" y="94" text-anchor="end">Tronco</text><text class="lbl" x="150" y="105" text-anchor="end">pulmonar</text><text class="lbl" x="262" y="60">Aorta</text>`;
  if(!Q) s+=`<text class="lbl" transform="translate(358,62) rotate(90)">veias pulmonares</text>`;
  if(Q){ /* modo pergunta: sem rótulos nem trajeto */ } else if(step>0){
    for(let j=0;j<step;j++){
      const v=HS[j].via, col=(j+1)>=8?"#dc2626":"#2563eb";
      s+=`<path class="trail" stroke="${col}" d="M${v.map(p=>p.join(" ")).join(" L")}"/>`;
    }
    const v=HS[step-1].via, col=step>=8?"#dc2626":"#2563eb";
    s+=`<circle r="7.5" fill="${col}" stroke="#fff" stroke-width="2.2"><animateMotion dur="1.7s" fill="freeze" path="M${v.map(p=>p.join(",")).join(" L")}"/></circle>`;
  } else {

  }
  return s+`</svg>`;
}

/* ----- Camadas do coração ----- */
const LSHORT={fib:"Pericárdio fibroso",par:"Lâmina parietal",cav:"Cavid. pericárdica",epi:"Epicárdio",mio:"Miocárdio",endo:"Endocárdio",luz:"Luz (sangue)"};
function svgLayers(sel,opt){
  const HIDE=!!(opt&&opt.hide), TGT=opt&&opt.target;
  const X0=40, W=150; let y=14;
  let s=`<svg class="hsvg" viewBox="0 0 340 250" role="img" aria-label="Camadas do coração">`;
  s+=`<defs><clipPath id="clipMio"><rect x="${X0}" y="88" width="${W}" height="86"/></clipPath></defs>`;
  const pos={};
  LAYERS.forEach(L=>{
    pos[L.id]=y;
    s+=`<g class="layer${(HIDE?L.id===TGT:sel===L.id)?" sel":""}" data-l="${L.id}"><rect class="lr" x="${X0}" y="${y}" width="${W}" height="${L.h}" fill="${L.c}" stroke="#78350f" stroke-width="1"/>`;
    if(L.id==="fib") for(let i=0;i<8;i++){ const x1=X0+i*20, x2=Math.min(X0+W,x1+24); if(x1>=X0+W) break; s+=`<line x1="${x1}" y1="${y+L.h}" x2="${x2}" y2="${y+L.h-(x2-x1)*L.h/24}" stroke="#a16207" stroke-width="1.2" opacity=".55"/>`; }
    if(L.id==="cav") for(let i=0;i<6;i++) s+=`<circle cx="${X0+14+i*26}" cy="${y+8}" r="2" fill="#7dd3fc"/>`;
    if(L.id==="epi") for(let i=0;i<7;i++) s+=`<circle cx="${X0+12+i*22}" cy="${y+9}" r="${i%3===1?4.5:3}" fill="${i%3===1?"#dc2626":"#fffbeb"}" opacity=".9"/>`;
    if(L.id==="mio"){ for(let i=0;i<8;i++){ const yy=y+8+i*10; s+=`<path d="M${X0} ${yy} C ${X0+40} ${yy-8}, ${X0+90} ${yy+8}, ${X0+W} ${yy}" fill="none" stroke="#7f1d1d" stroke-width="2.2" opacity=".75"/>`; } }
    if(L.id==="luz") for(let i=0;i<8;i++) s+=`<ellipse cx="${X0+14+i*18}" cy="${y+12+(i%2)*18}" rx="7" ry="4.2" fill="#dc2626" opacity=".85"/>`;
    const my=y+L.h/2;
    if(!HIDE) s+=`<line x1="${X0+W}" y1="${my}" x2="${X0+W+14}" y2="${my}" stroke="#94a3b8" stroke-width="1"/><text class="ltx" x="${X0+W+18}" y="${my}" dominant-baseline="central">${LSHORT[L.id]}</text></g>`;
    else s+=(L.id===TGT?`<line x1="${X0+W}" y1="${my}" x2="${X0+W+16}" y2="${my}" stroke="#f59e0b" stroke-width="2.4"/><circle cx="${X0+W+28}" cy="${my}" r="11" fill="#f59e0b"/><text x="${X0+W+28}" y="${my+.5}" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="800" fill="#0f172a">?</text>`:"")+`</g>`;
    y+=L.h;
  });
  if(!HIDE){
  // colchetes
  const yE=pos.epi, yEnd=pos.endo+12;
  s+=`<path d="M32 14 L26 14 L26 ${pos.epi} L32 ${pos.epi}" fill="none" stroke="#92400e" stroke-width="1.6"/><text class="lbl" transform="translate(14,${(14+pos.epi)/2}) rotate(-90)" text-anchor="middle">Pericárdio</text>`;
  s+=`<path d="M32 ${yE+1} L26 ${yE+1} L26 ${yEnd} L32 ${yEnd}" fill="none" stroke="#b91c1c" stroke-width="1.6"/><text class="lbl" transform="translate(14,${(yE+yEnd)/2}) rotate(-90)" text-anchor="middle">Parede (3 camadas)</text>`;
  s+=`<text class="lbl" x="${X0+W/2}" y="8" text-anchor="middle">⬆ fora</text><text class="lbl" x="${X0+W/2}" y="248" text-anchor="middle">dentro ⬇</text>`;
  }
  return s+`</svg>`;
}

/* ----- Células do sangue ----- */
function scat(n,r,seed){ const o=[]; for(let i=0;i<n;i++){ const a=i*2.39996+seed, rr=r*Math.sqrt((i+.6)/n); o.push([50+rr*Math.cos(a),50+rr*Math.sin(a)]); } return o; }

  else if(id==="neu") b=`<circle cx="50" cy="50" r="38" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/>`+scat(34,32,1).map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.2" fill="#f472b6"/>`).join("")+`<path d="M36 40 L52 32 L64 48 L52 62" fill="none" stroke="#6d28d9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`+[[36,40],[52,32],[64,48],[52,62]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="#6d28d9"/>`).join("");

  else if(id==="bas") b=`<circle cx="50" cy="50" r="38" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/><path d="M34 34 C 58 28, 70 42, 54 52 C 40 60, 52 68, 66 64 L68 74 C 44 82, 28 66, 44 54 C 56 46, 48 40, 32 44 Z" fill="#6366f1" opacity=".65"/>`+scat(24,31,3).map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4.6" fill="#1e1b4b" stroke="#4338ca" stroke-width=".8"/>`).join("");
  else if(id==="lin") b=`<circle cx="50" cy="50" r="31" fill="#bfdbfe" stroke="#93c5fd" stroke-width="2"/><circle cx="50" cy="50" r="25" fill="#5b21b6"/>`+scat(7,15,4).map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.4" fill="#8b5cf6"/>`).join("");
  else if(id==="mon") b=`<circle cx="50" cy="50" r="43" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>`+[[22,60],[78,34],[26,32],[74,70],[60,84]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="#f1f5f9"/>`).join("")+`<path d="M38 28 C 62 24, 78 44, 65 63 C 57 75, 38 75, 33 62 C 46 60, 52 50, 44 42 C 38 38, 34 33, 38 28 Z" fill="#8b5cf6" stroke="#6d28d9" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${esc(CELLS[id].n)}">${b}</svg>`;

function bilayer(y,x0,x1,gaps){
  let s=""; for(let x=x0+6;x<x1;x+=12){ if(gaps&&gaps.some(g=>x>g[0]&&x<g[1])) continue;
    s+=`<circle class="lh" cx="${x}" cy="${y-14}" r="5"/><circle class="lh" cx="${x}" cy="${y+14}" r="5"/><line class="lt" x1="${x-2}" y1="${y-9}" x2="${x-2}" y2="${y+9}"/><line class="lt" x1="${x+2}" y1="${y-9}" x2="${x+2}" y2="${y+9}"/>`; }
  return s;
}

/* comparação tolerante: sem acento, sem artigos, com pequenos erros de digitação */
const normA=s=>String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\b(o|a|os|as|do|da|de|dos|das)\b/g," ").replace(/\s+/g," ").trim();
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let p=Array.from({length:n+1},(_,j)=>j); for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
/* distância entre o que a pessoa escreveu (já normalizado) e uma lista de respostas aceitas.
   Itens que começam com "=" só valem se forem idênticos (sem tolerância). */
function distAns(n,list){
  let best=99;
  list.forEach(a=>{
    const raw=String(a), exact=raw[0]==="=", m=normA(exact?raw.slice(1):raw); if(!m) return;
    if(n===m){ best=0; return; }
    if(exact) return;
    if(m.length>=5&&n.length>=5){ const l=lev(n,m); if(l<=(m.length>=12?2:1)) best=Math.min(best,l); }
    if(m.length>=6&&n.includes(m)&&n.length<=m.length+12) best=Math.min(best,.5);
  });
  return best;
}
/* aceita se estiver perto das respostas deste item e mais perto dele do que de qualquer outro item do mesmo grupo */
function matchItem(inp,it,all){
  const n=normA(inp); if(!n) return false;
  const ds=distAns(n,[it.name,...it.ans]); if(ds>=99) return false;
  const dOther=Math.min(99,...all.filter(o=>o.g===it.g&&o!==it).map(o=>distAns(n,[o.name,...o.ans])));
  return ds===0||ds<dOther;
}

/* ---------- Player (vídeo curto) ---------- */
const P={scenes:[],i:0,playing:false,timer:null,speed:1,rem:0,t0:0,box:null};
function stopPlayer(){ clearTimeout(P.timer); P.timer=null; if(P.playing){P.playing=false;} const pl=document.getElementById("player"); if(pl) pl.classList.add("paused"); const b=document.getElementById("pplay"); if(b) b.textContent="▶"; }
function mountPlayer(box,scenes){
  clearTimeout(P.timer); P.box=box; P.scenes=scenes; P.i=0; P.playing=true;
  box.innerHTML=`<div class="player" id="player"><div class="stitle"><span id="ptitle"></span><span id="pcount"></span></div>
   <div class="screen" id="pscreen"></div><div class="segs" id="psegs"></div>
   <div class="ctrl"><button class="cb" id="pprev" aria-label="Anterior">⏮</button><button class="cb big" id="pplay" aria-label="Pausar">⏸</button><button class="cb" id="pnext" aria-label="Próxima">⏭</button><button class="cb sp" id="pspeed">${P.speed===1?"1×":"0,5×"}</button></div></div>`;
  $("pprev").onclick=()=>{P.playing=true;go(Math.max(0,P.i-1));};
  $("pnext").onclick=()=>{P.playing=true;go(Math.min(P.scenes.length-1,P.i+1));};
  $("pspeed").onclick=()=>{P.speed=P.speed===1?0.5:1;$("pspeed").textContent=P.speed===1?"1×":"0,5×";P.playing=true;go(P.i);};
  $("pplay").onclick=togglePlay;
  go(0);
}
function schedule(ms){
  clearTimeout(P.timer); P.rem=ms; P.t0=performance.now();
  P.timer=setTimeout(()=>{ if(P.i<P.scenes.length-1) go(P.i+1); else {P.playing=false;$("pplay").textContent="🔁";$("player").classList.add("paused");} },ms);
}
function go(i){
  const sc=P.scenes[i]; P.i=i;
  const dur=(sc.d||5.5)/P.speed;
  $("pscreen").innerHTML=`<div class="scene">${sc.vis}<div class="cap">${sc.say}</div></div>`;
  $("ptitle").textContent=`${i+1}. ${sc.t}`; $("pcount").textContent=`Cena ${i+1} de ${P.scenes.length}`;
  $("psegs").innerHTML=P.scenes.map((_,k)=>`<button data-i="${k}" class="${k<i?"done":k===i?"cur":""}" style="--d:${dur}s" aria-label="Cena ${k+1}"><i></i></button>`).join("");
  $("psegs").querySelectorAll("button").forEach(b=>b.onclick=()=>{P.playing=true;go(+b.dataset.i);});
  animateCounts($("pscreen"));
  const pl=$("player");
  if(P.playing){ pl.classList.remove("paused"); $("pplay").textContent="⏸"; schedule(dur*1000); }
  else { clearTimeout(P.timer); pl.classList.add("paused"); $("pplay").textContent="▶"; }
}
function togglePlay(){
  const pl=$("player");
  if(P.playing){ P.playing=false; clearTimeout(P.timer); P.rem=Math.max(300,P.rem-(performance.now()-P.t0)); pl.classList.add("paused"); $("pplay").textContent="▶"; }
  else {
    const atEnd=$("pplay").textContent==="🔁";
    P.playing=true;
    if(atEnd){ go(0); return; }
    pl.classList.remove("paused"); $("pplay").textContent="⏸"; schedule(P.rem||2000);
  }
}

/* ----- jogo de ordenar ----- */
function orderGame(box,items,solution){
  let pool=shuffle(items), ans=[], checked=false;
  const lab=id=>items.find(i=>i.id===id);
  function draw(){
    const free=pool.filter(p=>!ans.includes(p));
    box.innerHTML=`<div class="og-ans">${solution.map((_,i)=>{const it=ans[i];const st=checked&&it?(it.id===solution[i]?"ok":"bad"):"";return `<button class="og-slot ${it?"has":""} ${st}" data-ai="${i}"><b>${i+1}</b><span>${it?esc(it.label):"toque numa opção abaixo"}</span></button>`;}).join("")}</div>
     <div class="og-pool">${free.map(p=>`<button class="og-chip" data-id="${p.id}">${esc(p.label)}</button>`).join("")}</div>
     <div class="two"><button class="btn mini" id="og-ck">Verificar</button><button class="btn soft mini" id="og-rs">Reiniciar</button></div><div class="og-msg" id="og-msg"></div>`;
    box.querySelectorAll(".og-chip").forEach(b=>b.onclick=()=>{ if(ans.length<solution.length){ ans.push(pool.find(p=>p.id===b.dataset.id)); checked=false; draw(); } });
    box.querySelectorAll(".og-slot.has").forEach(b=>b.onclick=()=>{ ans.splice(+b.dataset.ai,1); checked=false; draw(); });
    $("og-rs").onclick=()=>{ pool=shuffle(items); ans=[]; checked=false; draw(); };
    $("og-ck").onclick=()=>{
      checked=true; draw();
      const ok=ans.filter((a,i)=>a.id===solution[i]).length, m=$("og-msg");
      if(ans.length<solution.length){ m.style.color="var(--warn)"; m.textContent=`Faltam ${solution.length-ans.length} item(ns). Até aqui: ${ok} no lugar certo.`; }
      else if(ok===solution.length){ m.style.color="var(--ok)"; m.textContent="🎉 Ordem perfeita!"; }
      else { m.style.color="var(--err)"; m.textContent=`${ok} de ${solution.length} no lugar certo. Toque nos itens vermelhos para tirar e tentar de novo.`; }
    };
  }
  draw();
}

  if(k==="osm") return `<div class="card"><b>💧 Osmose</b>${svgOsmose()}
    <div class="sbox">Passagem de <b>água</b> por uma <b>membrana semipermeável</b>, do meio <b>hipotônico</b> (menos soluto) para o <b>hipertônico</b> (mais soluto). Não gasta ATP. Macete: <b>a água vai atrás do soluto</b>.</div></div>
    <div class="card"><b>🩸 Osmose na hemácia</b>${svgTonic()}<div class="sbox">Hipotônico: a célula <b>incha</b> (pode sofrer <b>lise</b>). Hipertônico: <b>murcha</b> (<b>crenação</b>). Isotônico: mantém a forma.</div></div>`;
  if(k==="sim") return `<div class="card"><b>🌬️ Difusão simples</b>${svgSimples()}
    <div class="sbox">Moléculas pequenas ou apolares (<b>O₂, CO₂</b>, lipídios, hormônios esteroides) atravessam a bicamada lipídica, do meio <b>mais</b> para o <b>menos</b> concentrado. <b>Sem proteína e sem ATP</b>.</div></div>`;
  if(k==="fac") return `<div class="card"><b>🚪 Difusão facilitada</b>${svgFacil()}
    <div class="sbox">Substâncias que não atravessam a bicamada (íons, <b>glicose</b>, aminoácidos) passam por proteínas: <b>canal</b> (um poro, como as aquaporinas) ou <b>carreadora</b> (liga-se, muda de forma e solta do outro lado). É <b>a favor do gradiente</b>, sem ATP; a carreadora pode <b>saturar</b>.</div></div>`;
  if(k==="ati") return `<div class="card"><b>⚡ Transporte ativo: bomba Na⁺/K⁺</b>${svgAtivo()}
    <div class="sbox"><b>Contra o gradiente</b>, com <b>ATP</b> e proteína (bomba). A bomba expulsa <b>3 Na⁺</b> e leva <b>2 K⁺</b> para dentro, mantendo o potencial de membrana e o volume da célula.</div></div>`;
  if(k==="vei") return `<div class="card"><b>📦 Endocitose</b>${svgEndo(false)}<div class="sbox"><b>Fagocitose</b> = englobar partículas <b>sólidas</b>; <b>pinocitose</b> = gotículas de <b>líquido</b>. Forma uma vesícula e gasta ATP.</div></div>
    <div class="card"><b>📤 Exocitose</b>${svgEndo(true)}<div class="sbox">A vesícula se funde à membrana e <b>libera o conteúdo para fora</b> (secreção de hormônios, neurotransmissores, resíduos). Gasta ATP.</div></div>`;
  return `<div class="card"><b>📋 Resumo dos tipos</b><div class="tscroll"><table class="tb"><tr><th>Tipo</th><th>Gradiente</th><th>ATP</th><th>Proteína</th><th>Exemplo</th></tr>
    <tr><td><b>Difusão simples</b></td><td>A favor</td><td>Não</td><td>Não</td><td>O₂, CO₂</td></tr>
    <tr><td><b>Osmose</b></td><td>Água: do hipo ao hipertônico</td><td>Não</td><td>Aquaporina (opcional)</td><td>Água na hemácia</td></tr>
    <tr><td><b>Difusão facilitada</b></td><td>A favor</td><td>Não</td><td>Canal ou carreadora</td><td>Glicose, íons</td></tr>
    <tr><td><b>Transporte ativo</b></td><td>Contra</td><td>Sim</td><td>Bomba</td><td>Na⁺/K⁺ ATPase</td></tr>
    <tr><td><b>Endo/exocitose</b></td><td>Em bloco</td><td>Sim</td><td>Vesículas</td><td>Fagocitose, secreção</td></tr></table></div>
    <div class="sbox"><b>Passivo</b>: difusão simples, osmose e difusão facilitada (sem ATP). <b>Ativo</b>: bomba e vesículas (com ATP).</div></div>`;
}
function pageMem(){
  return `<div class="chips" id="mchips">${MEMT.map(([k,n])=>`<button data-k="${k}" class="${k===memSel?"on":""}">${n}</button>`).join("")}</div><div id="mbody">${memBody(memSel)}</div>`;
}
function bindMem(){
  $("mchips").onclick=e=>{ const b=e.target.closest("[data-k]"); if(!b) return; memSel=b.dataset.k; $("mchips").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); $("mbody").innerHTML=memBody(memSel); };
}

/* =====================  TREINAR  ===================== */
let qFilter="all", qLen=10, QS=null, qMode="mc";
function renderQuizHome(){
  showView("quiz"); QS=null; IS=null;
  $("v-quiz").innerHTML=`<div class="seg" style="margin-bottom:12px"><button data-qm="mc" class="${qMode==="mc"?"on":""}">📝 Múltipla escolha</button><button data-qm="img" class="${qMode==="img"?"on":""}">🖼️ Imagens (escreva)</button></div><div id="qsub"></div>`;
  $("v-quiz").querySelectorAll("[data-qm]").forEach(b=>b.onclick=()=>{ qMode=b.dataset.qm; renderQuizHome(); });
  if(qMode==="img") renderIQHome(); else renderMCHome();
}
function renderMCHome(){
  QS=null;
  const n=qFilter==="all"?QZ.length:QZ.filter(q=>q.t===qFilter).length;
  $("qsub").innerHTML=`<div class="card"><b>🎯 Treinar</b><p class="hint">Questões e alternativas sempre embaralhadas.</p>
    <h2 class="sec" style="margin-top:6px">Assunto</h2>
    <div class="chips"><button data-f="all" class="${qFilter==="all"?"on":""}">Todos</button>${TOPICS.map(t=>`<button data-f="${t.id}" class="${qFilter===t.id?"on":""}">${t.e} ${t.s||t.t.split(" ")[0]}</button>`).join("")}</div>
    <h2 class="sec">Questões por rodada</h2>
    <div class="seg">${[[5,"5"],[10,"10"],[0,"Todas"]].map(x=>`<button data-l="${x[0]}" class="${qLen===x[0]?"on":""}">${x[1]}</button>`).join("")}</div>
    <button class="btn" id="qgo">▶ Começar (${qLen&&qLen<n?qLen:n} questões)</button></div>`;
  $("v-quiz").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ qFilter=b.dataset.f; renderQuizHome(); });
  $("v-quiz").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ qLen=+b.dataset.l; renderQuizHome(); });
  $("qgo").onclick=startQuiz;
}
function startQuiz(){
  let pool=shuffle(qFilter==="all"?QZ:QZ.filter(q=>q.t===qFilter));
  if(qLen>0) pool=pool.slice(0,qLen);
  QS={deck:pool,i:0,ok:0,bad:0,done:false,miss:[]}; renderQ();
}
function renderQ(){
  if(QS.i>=QS.deck.length) return renderQResult();
  QS.done=false;
  const q=QS.deck[QS.i], order=shuffle(q.o.map((_,i)=>i)), T=TOPICS.find(t=>t.id===q.t);
  $("v-quiz").innerHTML=`<div class="qhead"><button class="x" id="qx" aria-label="Sair">✕</button><div class="prog"><div class="qmeta"><span>Questão ${QS.i+1} de ${QS.deck.length}</span><span>✅ ${QS.ok} &nbsp;❌ ${QS.bad}</span></div><div class="bar"><i style="width:${Math.round(QS.i/QS.deck.length*100)}%"></i></div></div></div>
   <div class="card"><span class="pill">${T.e} ${T.t}</span><div class="qtext">${esc(q.q)}</div>
   <div class="opts" id="opts">${order.map((oi,k)=>`<button class="opt" data-k="${k}"><span class="lt">${"ABCDE"[k]}</span><span>${esc(q.o[oi])}</span></button>`).join("")}</div><div id="fb"></div></div>`;
  $("qx").onclick=()=>{ if(confirm("Sair do treino?")) renderQuizHome(); };
  $("opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(QS.done) return; QS.done=true;
    const k=+b.dataset.k, ok=order[k]===q.a;
    $("opts").querySelectorAll(".opt").forEach((x,idx)=>{ x.disabled=true; if(order[idx]===q.a) x.classList.add("ok"); else if(idx===k) x.classList.add("bad"); });
    if(ok) QS.ok++; else { QS.bad++; QS.miss.push(q); }
    const last=QS.i+1>=QS.deck.length;
    $("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><div class="fbh"><span class="fbi">${ok?"✓":"✕"}</span><div><small>${ok?"Certo!":"Resposta correta"}</small><b>${esc(q.o[q.a])}</b></div></div><div class="tip"><small>Explicação</small>${q.x}</div><button class="btn dark" id="nx">${last?"Ver resultado":"Próxima →"}</button></div>`;
    $("nx").onclick=()=>{ QS.i++; renderQ(); };
    setTimeout(()=>{ const f=$("fb"); if(f) f.scrollIntoView({behavior:"smooth",block:"nearest"}); },80);
  });
}
function renderQResult(){
  const n=QS.ok+QS.bad, acc=n?Math.round(QS.ok/n*100):0;
  $("v-quiz").innerHTML=`<div class="card result"><div class="trophy">${acc>=90?"🏆":acc>=70?"🎉":acc>=50?"👍":"💪"}</div><h2>Resultado</h2><p>${acc>=70?"Muito bem!":"Vale revisar os tópicos abaixo."}</p>
   <div class="rs"><div style="background:var(--ok-soft);color:var(--ok)"><b>${QS.ok}</b><span>Acertos</span></div><div style="background:var(--err-soft);color:var(--err)"><b>${QS.bad}</b><span>Erros</span></div><div style="background:var(--bg)"><b>${acc}%</b><span>Aproveit.</span></div></div>
   ${QS.miss.length?`<h2 class="sec" style="text-align:center">Para rever</h2><div class="tags" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center">${[...new Set(QS.miss.map(q=>q.t))].map(t=>{const T=TOPICS.find(x=>x.id===t);return `<button class="tag" style="border:0" data-t="${t}">${T.e} ${T.t}</button>`;}).join("")}</div>`:""}
   <button class="btn" id="again">🔄 Jogar de novo</button><button class="btn soft" id="hm">Voltar aos tópicos</button></div>`;
  $("v-quiz").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>openTopic(b.dataset.t));
  $("again").onclick=startQuiz; $("hm").onclick=renderHome;
}

/* =====================  SISTEMA RESPIRATÓRIO: TELAS  ===================== */
let respSel="ar";
const RT=[["ar","Caminho do ar"],["pul","Pulmões"],["ven","Ventilação"],["tro","Trocas gasosas"],["tra","Transporte"],["con","Controle"],["vol","Volumes"]];

function respBody(k){
  if(k==="ar") return `<div class="card"><b>🫁 Caminho do ar: do nariz aos alvéolos</b>
    <p class="hint">Os números mostram a ordem. A <b>zona de condução</b> (nariz até os bronquíolos) só leva o ar; a <b>zona respiratória</b> (alvéolos) faz as trocas.</p>
    ${svgAir(0)}<button class="btn vio" id="anim">▶ Animar o caminho do ar (9 passos)</button></div>
    <div id="pbox"></div>
    <div class="card"><b>📋 Ordem do caminho</b><p class="hint" style="margin-bottom:4px">Toque em um passo para ver a animação dele.</p>
      <ul class="steplist">${AS.map((s,i)=>`<li data-i="${i}" class="v"><b>${i+1}</b><span>${s.n}</span><em>${i<7?"condução":"trocas"}</em></li>`).join("")}</ul></div>
    <div class="card"><b>🧩 Monte a ordem</b><p class="hint">Do <b>1º ao 9º</b> passo, a partir do nariz.</p><div id="og3"></div></div>`;
  if(k==="pul") return `<div class="card"><b>🫁 Lobos dos pulmões</b>${svgLobes()}
    <div class="sbox">O pulmão <b>direito</b> tem <b>3 lobos</b> (superior, médio e inferior). O <b>esquerdo</b> tem <b>2 lobos</b> (superior e inferior) e a <b>incisura cardíaca</b>, que dá espaço ao coração: por isso é um pouco menor.</div></div>
    <div class="card"><b>🧴 Pleuras</b>${svgPleura()}
    <div class="sbox">A pleura <b>visceral</b> cobre o pulmão; a <b>parietal</b> reveste a parede torácica. Entre elas, a <b>cavidade pleural</b> com um fino filme de líquido, que reduz o atrito e mantém o pulmão acompanhando a caixa torácica (a pressão ali é <b>subatmosférica</b>). Se entra ar nessa cavidade (pneumotórax), o pulmão colapsa.</div></div>`;
  if(k==="ven") return `<div class="card"><b>🌬️ Ventilação: inspiração × expiração</b>${ventWidget()}
    <div class="sbox"><b>Lei de Boyle:</b> pressão e volume são inversamente proporcionais. Aumentou o volume torácico → caiu a pressão → o ar entra. O diafragma é controlado pelo <b>nervo frênico</b> (C3–C5).</div></div>`;
  if(k==="tro") return `<div class="card"><b>💨 Hematose no alvéolo</b>${svgAlveolo()}
    <div class="sbox">O O₂ passa do alvéolo para o sangue e o CO₂ faz o caminho inverso, por <b>difusão simples</b>, a favor do gradiente de pressão parcial. O sangue chega <b>venoso</b> (escuro) e sai <b>arterial</b> (vivo).</div></div>
    <div class="card"><b>🧬 Quem trabalha no alvéolo</b><div class="two2" style="margin-top:8px">
      <div class="mini2" style="background:#dbeafe"><b>Pneumócito tipo I</b>Célula achatada: forma a parede fina e faz as <b>trocas gasosas</b>.</div>
      <div class="mini2" style="background:#dcfce7"><b>Pneumócito tipo II</b>Produz o <b>surfactante</b>, que reduz a tensão superficial e evita o colapso.</div>
      <div class="mini2" style="background:#fef3c7"><b>Macrófago alveolar</b>Fagocita poeira e microrganismos que chegam aos alvéolos.</div>
      <div class="mini2" style="background:#fee2e2"><b>Barreira hematogasosa</b>Parede alveolar + endotélio do capilar: muito fina, facilita a difusão.</div></div></div>`;
  if(k==="tra") return `<div class="card"><b>🩸 Como o O₂ viaja</b>${stackBar([{p:98.5,c:"#dc2626",l:"Ligado à hemoglobina (oxiemoglobina)"},{p:1.5,c:"#38bdf8",l:"Dissolvido no plasma"}])}
    <div class="sbox">Cada hemoglobina tem 4 grupos heme e liga até <b>4 O₂</b>. O monóxido de carbono (CO) se liga à hemoglobina com afinidade muito maior (≈ 200×), por isso é tão perigoso.</div></div>
    <div class="card"><b>🫧 Como o CO₂ viaja</b>${stackBar([{p:70,c:"#7c3aed",l:"Bicarbonato (HCO₃⁻)"},{p:23,c:"#f59e0b",l:"Carbamino-hemoglobina"},{p:7,c:"#38bdf8",l:"Dissolvido"}])}
    <div class="sbox"><b>CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻</b><br>A reação é acelerada pela <b>anidrase carbônica</b> nas hemácias. Nos pulmões ela corre no sentido contrário e o CO₂ é eliminado.</div></div>`;
  if(k==="con") return `<div class="card"><b>🧠 Quem controla a respiração</b>
    <div class="flow">
     <div class="fbox appear" style="animation-delay:.2s">⬆️ <b>↑ CO₂ (↓ pH)</b> no sangue<small>principal estímulo</small></div><div class="farr">⬇</div>
     <div class="fbox appear" style="animation-delay:1s"><b>Quimiorreceptores</b><small>centrais (bulbo) e periféricos (corpos carotídeos e aórticos, que também sentem ↓ O₂)</small></div><div class="farr">⬇</div>
     <div class="fbox appear" style="animation-delay:1.8s"><b>Centro respiratório</b><small>bulbo (ritmo básico) e ponte (centro pneumotáxico, que limita a inspiração)</small></div><div class="farr">⬇</div>
     <div class="fbox appear" style="animation-delay:2.6s"><b>Nervos motores</b><small>frênico (C3–C5) → diafragma · intercostais → músculos intercostais</small></div><div class="farr">⬇</div>
     <div class="fbox appear" style="animation-delay:3.4s">🫁 <b>↑ frequência e profundidade</b><small>mais CO₂ eliminado</small></div></div>
    <div class="sbox">O principal estímulo é o <b>aumento de CO₂</b>, e não a falta de O₂. A queda do O₂ só estimula forte quando fica bem baixa (abaixo de ≈ 60 mmHg).</div></div>`;
  return `<div class="card"><b>📈 Volumes e capacidades (espirometria)</b><p class="hint">Valores aproximados de um adulto jovem. Toque em ▶ para redesenhar o traçado.</p>
    <div id="spiro">${svgSpiro()}</div><button class="btn soft mini" id="spiroR">▶ Redesenhar o traçado</button>
    <div class="tscroll" style="margin-top:8px"><table class="tb"><tr><th>Sigla</th><th>Nome</th><th>mL</th></tr>
    <tr><td><b>VC</b></td><td>Volume corrente</td><td>≈ 500</td></tr>
    <tr><td><b>VRI</b></td><td>Volume de reserva inspiratório</td><td>≈ 3.000</td></tr>
    <tr><td><b>VRE</b></td><td>Volume de reserva expiratório</td><td>≈ 1.100</td></tr>
    <tr><td><b>VR</b></td><td>Volume residual</td><td>≈ 1.200</td></tr>
    <tr><td><b>CV</b></td><td>Capacidade vital = VC + VRI + VRE</td><td>≈ 4.600</td></tr>
    <tr><td><b>CI</b></td><td>Capacidade inspiratória = VC + VRI</td><td>≈ 3.500</td></tr>
    <tr><td><b>CRF</b></td><td>Capacidade residual funcional = VRE + VR</td><td>≈ 2.300</td></tr>
    <tr><td><b>CPT</b></td><td>Capacidade pulmonar total = CV + VR</td><td>≈ 5.800</td></tr></table></div>
    <div class="sbox">O <b>volume residual</b> fica nos pulmões mesmo após a expiração máxima: por isso não aparece na espirometria simples.</div></div>`;
}
function pageResp(){
  return `<div class="chips" id="rchips">${RT.map(([k,n])=>`<button data-k="${k}" class="${k===respSel?"on":""}">${n}</button>`).join("")}</div><div id="rbody">${respBody(respSel)}</div>`;
}
function startAir(i){
  mountPlayer($("pbox"),AS.map((s,k)=>({t:s.n,d:6,vis:svgAir(k+1),say:s.say})));
  if(i>0) go(i);
  setTimeout(()=>$("pbox").scrollIntoView({behavior:"smooth",block:"start"}),60);
}
function bindRespSection(k){
  if(k==="ar"){
    $("anim").onclick=()=>startAir(0);
    $("v-topic").querySelectorAll(".steplist li").forEach(li=>li.onclick=()=>startAir(+li.dataset.i));
    orderGame($("og3"),AS.map((s,i)=>({id:"a"+i,label:s.n})),AS.map((s,i)=>"a"+i));
  }
  if(k==="ven"){
    $("vent").querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
      $("vent").classList.remove("auto","insp","exp"); $("vent").classList.add(b.dataset.v);
      $("vent").querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b));
    });
  }
  if(k==="vol"){ $("spiroR").onclick=()=>{ $("spiro").innerHTML=svgSpiro(); }; }
}
function bindResp(){
  bindRespSection(respSel);
  $("rchips").onclick=e=>{
    const b=e.target.closest("[data-k]"); if(!b) return;
    stopPlayer(); respSel=b.dataset.k;
    $("rchips").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    $("rbody").innerHTML=respBody(respSel); bindRespSection(respSel);
  };
}

function boot(){ renderHome(); }
if(LICENCA){
  $("chip").style.display="none";
  loadScript("../modulos.js",()=>loadScript("../license.js",()=>{ FFLicense.gate("fisio",boot); if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{})); } }));
} else {
  $("toportal").style.display="none"; $("tabs").style.gridTemplateColumns="repeat(2,1fr)"; $("logo").removeAttribute("href");
  boot();
}
