<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>FarmaFund – Fundamentos da Prática Farmacêutica</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#0f766e; --brand2:#14b8a6; --brand-soft:#ccfbf1;
  --ok:#059669; --ok-soft:#d1fae5; --err:#e11d48; --err-soft:#ffe4e6;
  --o:#2563eb; --o-soft:#dbeafe; --a:#7c3aed; --a-soft:#ede9fe; --warn:#d97706; --warn-soft:#fef3c7;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1220; --card:#131c2e; --text:#e5edf7; --muted:#94a3b8; --line:#243049;
    --brand:#14b8a6; --brand2:#2dd4bf; --brand-soft:#0f2f2c;
    --ok:#34d399; --ok-soft:#08302a; --err:#fb7185; --err-soft:#3a1420;
    --o:#60a5fa; --o-soft:#13243f; --a:#a78bfa; --a-soft:#251c45; --warn:#fbbf24; --warn-soft:#3a2a0a;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}
#app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}

.top{padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 16px;background:linear-gradient(135deg,#0f766e,#115e59 60%,#134e4a);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(15,118,110,.25);flex-shrink:0}
.logo{display:flex;align-items:center;gap:11px}
.logo .ic{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:22px}
.logo h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
.logo p{margin:0;font-size:12px;opacity:.8}
.chip{background:rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}

main{flex:1;overflow-y:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.view{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 8px);flex-shrink:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:14px;color:var(--muted);font-size:11.5px;font-weight:700;position:relative}
.tab .e{font-size:21px;line-height:1.1}
.tab.on{color:var(--brand);background:var(--brand-soft)}
.badge{position:absolute;top:2px;right:calc(50% - 26px);background:var(--err);color:#fff;border-radius:999px;font-size:10px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 4px 9px;font-weight:800}
h2.sec:first-child{margin-top:4px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

.seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:14px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}

.regions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.region{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:left;box-shadow:var(--shadow);transition:transform .1s}
.region:active{transform:scale(.97)}
.region.all{grid-column:1/-1;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border:0}
.region.vid{grid-column:1/-1;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:0;display:flex;align-items:center;gap:12px}
.region.vid .me{font-size:30px}
.region b{display:block;font-size:15px}
.region small{font-size:12px;color:var(--muted)}
.region.all small,.region.vid small{color:rgba(255,255,255,.88)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:99px;transition:width .3s}
.region.all .bar{background:rgba(255,255,255,.3)}
.region.all .bar i{background:#fff}

.btn{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15.5px;background:var(--brand);color:#fff;margin-top:10px;box-shadow:0 4px 12px rgba(15,118,110,.25)}
.btn.dark{background:var(--text);color:var(--bg);box-shadow:none}
.btn.soft{background:var(--bg);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.warn{background:#f59e0b}
.btn.vio{background:linear-gradient(135deg,#7c3aed,#2563eb)}
.btn:disabled{opacity:.45}
.btn.mini{padding:10px;font-size:14px;margin-top:8px}

/* Quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.x{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px;flex-shrink:0}
.prog{flex:1}
.prog .bar{height:10px;margin:0}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
.pill{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:12px;padding:4px 11px;border-radius:99px;margin-bottom:10px}
.qtext{font-size:17.5px;font-weight:800;margin:4px 0 14px;line-height:1.4}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:11px;align-items:center;text-align:left;padding:12px 13px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px}
.opt .lt{width:28px;height:28px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted);flex-shrink:0}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .lt{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--err);background:var(--err-soft)} .opt.bad .lt{background:var(--err);color:#fff}
textarea.ans{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:15px;outline:none;resize:vertical;min-height:120px}
textarea.ans:focus{border-color:var(--brand)}

.fb{margin-top:14px;border-radius:18px;padding:15px;border:2px solid;animation:in .25s}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--err-soft);border-color:var(--err)}
.fb.neu{background:var(--brand-soft);border-color:var(--brand)}
.fbh{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fbi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex-shrink:0}
.ok .fbi{background:var(--ok)} .bad .fbi{background:var(--err)} .neu .fbi{background:var(--brand)}
.fbh small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.ok .fbh small{color:var(--ok)} .bad .fbh small{color:var(--err)} .neu .fbh small{color:var(--brand)}
.fbh b{font-size:16px;line-height:1.3}
.tip{margin-top:8px;font-size:14px;background:var(--card);border-radius:12px;padding:10px 12px}
.tip small{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.attempt{font-size:13px;color:var(--muted);margin:-2px 0 8px}
.attempt s{color:var(--err);font-weight:700}
.model{background:var(--card);border-left:5px solid var(--brand);border-radius:12px;padding:11px 13px;font-size:14px;margin-top:12px}
.model small{display:block;font-size:11px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.result{text-align:center}
.trophy{font-size:56px;margin:4px 0}
.result h2{margin:0;font-size:24px}
.result p{color:var(--muted);margin:4px 0 14px}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.rs div{border-radius:14px;padding:12px 4px}
.rs b{display:block;font-size:24px}
.rs span{font-size:11px;font-weight:800;text-transform:uppercase}
.brk{text-align:left;margin:10px 0}
.brk div{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;padding:6px 0;border-bottom:1px dashed var(--line)}

.warnmsg{color:var(--warn);font-size:13px;font-weight:700;margin:8px 2px 0}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty .big{font-size:44px}
.banner{display:flex;align-items:center;gap:12px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:16px;padding:12px 14px;margin-bottom:12px;width:100%;text-align:left}
.banner b{display:block;font-size:14px}
.banner small{color:var(--muted)}

/* Estudo */
details.m{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden}
details.m summary{list-style:none;padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.m summary::-webkit-details-marker{display:none}
details.m summary b{flex:1;font-size:15px}
details.m summary::after{content:"›";font-size:22px;color:var(--muted);transition:transform .2s}
details.m[open] summary::after{transform:rotate(90deg)}
.mbody{padding:0 14px 14px;font-size:14.5px}
.mbody ul{margin:6px 0;padding-left:20px}
.mbody li{margin:4px 0}
.mbody p{margin:6px 0}
.kv{background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0}
.tl>div{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.tl b{min-width:50px;color:var(--brand)}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
table.tb th,table.tb td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fml{font-size:16px;font-weight:800;background:var(--brand-soft);color:var(--brand);border-radius:12px;padding:10px 12px;margin:8px 0}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.fields label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin-bottom:4px}
.fields input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px;font-weight:700;outline:none}
.fields input:focus{border-color:var(--brand)}
.steps ol{margin:6px 0;padding-left:20px;font-size:14.5px}
.steps li{margin:6px 0}

/* Player de animação */
.player{margin-top:6px}
.stitle{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;margin-bottom:8px}
.stitle span:last-child{color:var(--muted);font-size:12px}
.screen{background:linear-gradient(180deg,var(--brand-soft),var(--card));border:1px solid var(--line);border-radius:20px;padding:14px;min-height:310px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.scene{animation:in .45s ease-out;display:flex;flex-direction:column;gap:10px}
.cap{text-align:center;font-size:15px;font-weight:600;padding:0 4px}
.vis{width:100%;max-height:215px}
.segs{display:flex;gap:4px;margin:12px 0 8px}
.segs button{flex:1;height:8px;border-radius:9px;background:var(--line);position:relative;overflow:hidden;padding:0}
.segs button i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--brand2)}
.segs button.done i{width:100%}
.segs button.cur i{animation:fillseg var(--d,5s) linear forwards}
@keyframes fillseg{to{width:100%}}
.paused .segs button.cur i,.paused .screen *{animation-play-state:paused!important}
.ctrl{display:flex;gap:10px;justify-content:center;align-items:center}
.cb{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px;box-shadow:var(--shadow)}
.cb.big{width:58px;height:58px;background:var(--brand);color:#fff;font-size:22px;border:0}
.cb.sp{font-size:13px;font-weight:800;width:52px;border-radius:23px}

.sc-body{fill:#334155}.sc-screen{fill:#0f172a}.sc-plate{fill:#94a3b8}
.sc-num{fill:#4ade80;font:700 17px ui-monospace,Menlo,monospace}
.drop{animation:rise 1.8s infinite ease-in}
@keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:.95}100%{transform:translateY(-38px);opacity:0}}
.smoke{transform-box:fill-box;transform-origin:center;animation:rise2 2.4s infinite ease-out}
@keyframes rise2{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.75}100%{transform:translateY(-48px) scale(1.5);opacity:0}}
.glow{animation:glow 1.1s infinite alternate}
@keyframes glow{from{opacity:.5}to{opacity:1}}
.s-dry{animation:dry 3.2s ease forwards}
@keyframes dry{from{fill:#7fb069}to{fill:#c9a46a}}
.s-burn{animation:burn 3.4s ease forwards}
@keyframes burn{from{fill:#7fb069}55%{fill:#3f3f46}to{fill:#9ca3af}}
.pulse{animation:pulse 1s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}

.eqs{display:grid;gap:10px;text-align:center}
.eq{font-size:19px;font-weight:700;opacity:0;animation:fadeup .6s forwards;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px}
.eq.big{background:var(--brand);color:#fff;border:0}
.eq.note{background:var(--warn-soft);border-color:var(--warn);font-size:14px;font-weight:600}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.n-a{color:var(--o)}.n-b{color:var(--a)}.n-r{color:var(--ok)}
.big .n-r,.big .n-a,.big .n-b{color:#fff}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 6px;font-size:.92em}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 8px 2px}
.frac>span:last-child{padding:2px 8px 0}

.res{text-align:center}
.ring{width:140px;height:140px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:conic-gradient(var(--ok) var(--p,100%),var(--line) 0);animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
.ring>div{width:108px;height:108px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:28px;font-weight:800}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.reslabel{font-weight:800;margin:8px 0}
.mbwrap{margin-top:8px}
.mbar{display:flex;height:42px;border-radius:13px;overflow:hidden;border:2px solid var(--line);background:var(--bg)}
.mbar .solid{background:#c9a46a;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.mbar .part{background:#38bdf8;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;animation:growx 1.1s .3s ease-out backwards}
.mbar .part.ash{background:#6b7280}
@keyframes growx{from{width:0}}
.legend{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-top:7px;gap:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;background:#c9a46a}
.legend i.w{background:#38bdf8}.legend i.ash{background:#6b7280}
.mtot{text-align:center;font-size:13px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <a class="logo" href="../index.html" style="color:inherit;text-decoration:none" aria-label="Voltar ao portal"><div class="ic">💊</div><div><h1>FarmaFund</h1><p>Fundamentos da Prática Farmacêutica</p></div></a>
    <div class="chip" id="chip">🔥 0</div>
  </header>

  <main id="main">
    <section id="v-home" class="view"></section>
    <section id="v-quiz" class="view hidden"></section>
    <section id="v-study" class="view hidden"></section>
    <section id="v-errors" class="view hidden"></section>
  </main>

  <nav class="tabs">
    <button class="tab on" data-tab="home"><span class="e">🏠</span>Início</button>
    <button class="tab" data-tab="study"><span class="e">📖</span>Estudar</button>
    <button class="tab" data-tab="errors"><span class="e">🎯</span>Erros<span class="badge hidden" id="errbadge">0</span></button>
  </nav>
</div>

<script src="../modulos.js"></script>
<script src="../license.js"></script>
<script>
/* =====================  DADOS  ===================== */
const PARTS = {
  conceitos:{n:"Conceitos básicos",e:"🧪"},
  legislacao:{n:"História e legislação",e:"📜"},
  analises:{n:"Análises clínicas",e:"🔬"},
  broma:{n:"Bromatologia (cálculos)",e:"🧮"}
};

const Q = [
 {id:1,part:"conceitos",q:"A homeopatia é um sistema terapêutico baseado em qual princípio?",
  o:["Princípio da semelhança.","Utilização exclusiva de antibióticos.","Eliminação de plantas medicinais.","Uso de medicamentos apenas injetáveis.","Utilização de vitaminas."],a:0,
  x:"Homeopatia = <b>“semelhante cura semelhante”</b> (princípio da semelhança): uma substância que causa sintomas em pessoa sadia, em doses diluídas, trata sintomas parecidos no doente."},
 {id:2,part:"conceitos",q:"A fitoterapia utiliza principalmente:",
  o:["Produtos de origem mineral.","Plantas medicinais e seus derivados.","Apenas medicamentos sintéticos.","Produtos exclusivamente animais.","Substâncias radioativas."],a:1,
  x:"<b>Fito</b> = planta. Fitoterapia é o tratamento com plantas medicinais e seus derivados (chás, extratos, tinturas, cápsulas)."},
 {id:3,part:"conceitos",q:"Qual é a principal diferença entre fármaco e medicamento?",
  o:["São palavras com significados totalmente iguais.","O fármaco é a substância ativa, enquanto o medicamento é o produto farmacêutico preparado para utilização.","O medicamento é sempre uma planta medicinal.","O fármaco é utilizado apenas em cosméticos.","O medicamento não apresenta princípio ativo."],a:1,
  x:"<b>Fármaco</b> = substância ativa (princípio ativo). <b>Medicamento</b> = produto pronto: fármaco + excipientes, em uma forma farmacêutica (comprimido, xarope...)."},
 {id:4,part:"conceitos",q:"Um agonista é uma substância que:",
  o:["Destrói os receptores celulares.","Impede a absorção de água.","Liga-se ao receptor e promove sua ativação.","Elimina todos os medicamentos do organismo.","Impede a circulação sanguínea."],a:2,
  x:"<b>Agonista</b> se liga ao receptor e o <b>ativa</b>, gerando resposta. O <b>antagonista</b> se liga e <b>bloqueia</b>, sem ativar."},
 {id:5,part:"legislacao",q:"Em que ano foram criados os primeiros cursos de Farmácia no Brasil?",
  o:["1500.","1808.","1832.","1960.","1973."],a:2,num:true,
  x:"Os primeiros cursos de Farmácia do Brasil foram criados em <b>1832</b>, ligados às faculdades de Medicina. 1960 é a Lei 3.820 (conselhos) e 1973 é a Lei 5.991 (controle sanitário)."},

/* =====================  UTILIDADES  ===================== */
const KEY="farmafund.v1";
let store={stats:{},missed:[],best:0,len:0};
function load(){ try{ const s=localStorage.getItem(KEY); if(s) store=Object.assign(store,JSON.parse(s)); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(e){} }
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rnd(n){ if(window.crypto&&crypto.getRandomValues){const u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]%n;} return Math.floor(Math.random()*n); }
const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=rnd(i+1);[r[i],r[j]]=[r[j],r[i]];}return r;};
const r4=n=>Math.round(n*10000)/10000;
const fmt=n=>r4(n).toLocaleString("pt-BR",{maximumFractionDigits:4});
const decs=n=>{const s=fmt(n),i=s.indexOf(",");return i<0?0:s.length-i-1;};
const qById=id=>Q.find(q=>q.id===id);
const isMastered=q=>{const s=store.stats[q.id];return !!s&&s.last===1&&s.ok>=2;};

let S=null, lastShown=null, studySeg="res", fromQuiz=false, autoplay=false;
const quizActive=()=>S&&S.i<S.deck.length;

/* =====================  NAVEGAÇÃO  ===================== */
function show(tab){
  if(tab!=="study") stopPlayer();
  ["home","quiz","study","errors"].forEach(v=>$("v-"+v).classList.toggle("hidden",v!==tab));
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===(tab==="quiz"?"home":tab)));
  $("main").scrollTop=0;
  if(tab==="home") renderHome();
  if(tab==="study") renderStudy();
  if(tab==="errors") renderErrors();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{fromQuiz=false;show(t.dataset.tab);});
function updateChrome(){
  $("chip").textContent="🔥 Recorde: "+store.best;
  const b=$("errbadge");b.textContent=store.missed.length;b.classList.toggle("hidden",store.missed.length===0);
}

/* =====================  INÍCIO  ===================== */
function renderHome(){
  const total=Q.length, mastered=Q.filter(isMastered).length;
  let ok=0,err=0;Object.values(store.stats).forEach(s=>{ok+=s.ok;err+=s.err;});
  const acc=ok+err?Math.round(ok/(ok+err)*100):0;
  let h="";
  if(quizActive()) h+=`<button class="banner" id="cont"><span style="font-size:26px">▶️</span><span><b>Continuar quiz em andamento</b><small>Questão ${S.i+1} de ${S.deck.length}</small></span></button>`;
  h+=`<div class="stats">
    <div class="stat"><b>${mastered}/${total}</b><span>Dominadas</span></div>
    <div class="stat"><b>${acc}%</b><span>Acertos</span></div>
    <div class="stat"><b>${store.missed.length}</b><span>Para rever</span></div></div>`;
  h+=`<h2 class="sec">Questões por rodada</h2><div class="seg">`+
    [[10,"10"],[20,"20"],[0,"Todas"]].map(x=>`<button data-len="${x[0]}" class="${store.len===x[0]?"on":""}">${x[1]}</button>`).join("")+`</div>`;
  h+=`<h2 class="sec">Praticar</h2><div class="regions">`;
  h+=`<button class="region all" data-part="all"><b>🎲 Simulado completo</b><small>${mastered} de ${total} dominadas · questões sempre embaralhadas</small><div class="bar"><i style="width:${mastered/total*100}%"></i></div></button>`;
  Object.entries(PARTS).forEach(([k,p])=>{
    const list=Q.filter(q=>q.part===k), md=list.filter(isMastered).length;
    h+=`<button class="region" data-part="${k}"><b>${p.e} ${p.n}</b><small>${md}/${list.length} dominadas</small><div class="bar"><i style="width:${md/list.length*100}%"></i></div></button>`;
  });
  h+=`<button class="region vid" id="gocalc"><span class="me">🎬</span><span><b>Cálculos animados</b><small>Umidade e cinzas, passo a passo em vídeo curto</small></span></button></div>`;
  $("v-home").innerHTML=h;
  if($("cont")) $("cont").onclick=()=>show("quiz");
  $("v-home").querySelectorAll("[data-len]").forEach(b=>b.onclick=()=>{store.len=+b.dataset.len;save();renderHome();});
  $("v-home").querySelectorAll("[data-part]").forEach(b=>b.onclick=()=>startQuiz(b.dataset.part==="all"?null:b.dataset.part));
  $("gocalc").onclick=()=>{studySeg="calc";fromQuiz=false;show("study");};
  updateChrome();
}

/* =====================  QUIZ  ===================== */
function startQuiz(part,custom){
  let pool=custom||(part?Q.filter(q=>q.part===part):Q);
  pool=shuffle(pool);                                   // sempre embaralhado
  if(pool.length>1&&lastShown!==null&&pool[0].id===lastShown){const k=1+rnd(pool.length-1);[pool[0],pool[k]]=[pool[k],pool[0]];}
  if(!custom&&store.len>0) pool=pool.slice(0,store.len);
  S={part,custom:!!custom,deck:pool,i:0,ok:0,bad:0,streak:0,answered:false,missed:[],res:{},order:[]};
  show("quiz"); renderQuestion();
}

function renderQuestion(){
  if(S.i>=S.deck.length) return renderResult();
  S.answered=false;
  const q=S.deck[S.i], pct=Math.round(S.i/S.deck.length*100), P=PARTS[q.part];
  let h=`<div class="qhead"><button class="x" id="qx" aria-label="Sair">✕</button>
   <div class="prog"><div class="qmeta"><span>Questão ${S.i+1} de ${S.deck.length}</span><span>✅ ${S.ok} &nbsp;❌ ${S.bad}${S.streak>=3?" &nbsp;🔥"+S.streak:""}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div></div>
   <div class="card"><span class="pill">${P.e} ${P.n}</span><div class="qtext">${esc(q.q)}</div>`;
  if(q.t==="open"){
    h+=`<textarea class="ans" id="open" placeholder="Escreva com suas palavras..."></textarea>
        <button class="btn" id="reveal">Ver resposta modelo</button><div id="fb"></div></div>`;
  } else {
    S.order=q.num?q.o.map((_,i)=>i):shuffle(q.o.map((_,i)=>i));   // alternativas embaralhadas (numéricas em ordem crescente)
    h+=`<div class="opts" id="opts">`+S.order.map((oi,k)=>`<button class="opt" data-k="${k}"><span class="lt">${"ABCDE"[k]}</span><span>${esc(q.o[oi])}</span></button>`).join("")+`</div><div id="fb"></div></div>`;
  }
  $("v-quiz").innerHTML=h; $("main").scrollTop=0;
  $("qx").onclick=()=>{ if(confirm("Sair do quiz? O progresso desta rodada será perdido.")){S=null;show("home");} };
  if(q.t==="open") $("reveal").onclick=()=>revealOpen(q);
  else $("opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>submitChoice(+b.dataset.k));
}

function record(q,ok){
  const st=store.stats[q.id]||(store.stats[q.id]={ok:0,err:0,last:0});
  const r=S.res[q.part]||(S.res[q.part]={ok:0,n:0}); r.n++;
  if(ok){S.ok++;S.streak++;st.ok++;st.last=1;r.ok++;store.missed=store.missed.filter(id=>id!==q.id);if(S.streak>store.best)store.best=S.streak;}
  else{S.bad++;S.streak=0;st.err++;st.last=0;S.missed.push(q.id);if(!store.missed.includes(q.id))store.missed.push(q.id);}
  save(); updateChrome();
}
function calcBtn(q){ return q.c?`<button class="btn vio mini" data-calc="${q.id}">🎬 Ver a animação desta conta</button>`:""; }
function bindCalc(root){ root.querySelectorAll("[data-calc]").forEach(b=>b.onclick=()=>{const q=qById(+b.dataset.calc);openCalc(q.c.type,q.c.v,quizActive()&&root.id==="fb");}); }
function nextLabel(){ return S.i+1>=S.deck.length?"Ver resultado":"Próxima questão →"; }

function submitChoice(k){
  if(S.answered) return; S.answered=true;
  const q=S.deck[S.i], ok=S.order[k]===q.a;
  $("opts").querySelectorAll(".opt").forEach((b,idx)=>{b.disabled=true;if(S.order[idx]===q.a)b.classList.add("ok");else if(idx===k)b.classList.add("bad");});
  record(q,ok);
  $("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}">
    <div class="fbh"><span class="fbi">${ok?"✓":"✕"}</span><div><small>${ok?"Certo! Muito bem!":"Resposta correta"}</small><b>${esc(q.o[q.a])}</b></div></div>
    <div class="tip"><small>Explicação</small>${q.x}</div>${calcBtn(q)}
    <button class="btn dark" id="next">${nextLabel()}</button></div>`;
  $("next").onclick=nextQuestion; bindCalc($("fb"));
  setTimeout(()=>$("fb").scrollIntoView({behavior:"smooth",block:"nearest"}),80);
}

function revealOpen(q){
  if(S.answered) return; S.answered=true;
  $("open").disabled=true; $("reveal").classList.add("hidden");
  $("fb").innerHTML=`<div class="model"><small>Resposta modelo</small>${q.x}</div>
    <h2 class="sec" style="margin-top:14px">Como você se saiu?</h2>
    <div class="two"><button class="btn mini" id="gOk" style="background:var(--ok)">✅ Acertei</button><button class="btn mini" id="gBad" style="background:var(--err)">❌ Preciso rever</button></div>`;
  const done=ok=>{record(q,ok);$("fb").innerHTML=`<div class="model"><small>Resposta modelo</small>${q.x}</div>
    <div class="fb ${ok?"ok":"bad"}"><div class="fbh"><span class="fbi">${ok?"✓":"✕"}</span><div><small>Autoavaliação</small><b>${ok?"Anotado como acerto!":"Anotado para revisar"}</b></div></div>
    <button class="btn dark" id="next">${nextLabel()}</button></div>`;$("next").onclick=nextQuestion;setTimeout(()=>$("next").scrollIntoView({behavior:"smooth",block:"nearest"}),80);};
  $("gOk").onclick=()=>done(true); $("gBad").onclick=()=>done(false);
  setTimeout(()=>$("fb").scrollIntoView({behavior:"smooth",block:"nearest"}),80);
}

function nextQuestion(){ lastShown=S.deck[S.i].id; S.i++; renderQuestion(); }

function renderResult(){
  const total=S.ok+S.bad, acc=total?Math.round(S.ok/total*100):0;
  const emoji=acc>=90?"🏆":acc>=70?"🎉":acc>=50?"👍":"💪";
  const msg=acc>=90?"Excelente domínio!":acc>=70?"Muito bom, continue assim!":acc>=50?"Bom caminho, revise os erros.":"Vamos reforçar esses temas!";
  let h=`<div class="card result"><div class="trophy">${emoji}</div><h2>Resultado</h2><p>${msg}</p>
   <div class="rs"><div style="background:var(--ok-soft);color:var(--ok)"><b>${S.ok}</b><span>Acertos</span></div>
   <div style="background:var(--err-soft);color:var(--err)"><b>${S.bad}</b><span>Erros</span></div>
   <div style="background:var(--bg)"><b>${acc}%</b><span>Aproveit.</span></div></div>`;
  const keys=Object.keys(S.res);
  if(keys.length>1) h+=`<div class="brk">`+keys.map(k=>`<div><span>${PARTS[k].e} ${PARTS[k].n}</span><span>${S.res[k].ok}/${S.res[k].n}</span></div>`).join("")+`</div>`;
  if(S.missed.length) h+=`<button class="btn warn" id="rev">🎯 Praticar só os erros</button>`;
  h+=`<button class="btn" id="again">🔄 Jogar novamente</button><button class="btn soft" id="home">Voltar ao início</button></div>`;
  $("v-quiz").innerHTML=h; $("main").scrollTop=0;
  if(S.missed.length) $("rev").onclick=()=>startQuiz(null,S.missed.map(qById));
  $("again").onclick=()=>S.custom?startQuiz(null,S.deck):startQuiz(S.part);
  $("home").onclick=()=>{S=null;show("home");};
}

/* =====================  ERROS  ===================== */
function renderErrors(){
  const list=store.missed.map(qById).filter(Boolean);
  if(!list.length){$("v-errors").innerHTML=`<div class="empty"><div class="big">🎯</div><b>Nenhum erro para revisar</b><br>As questões que você errar aparecem aqui para reforço.</div>`;return;}
  $("v-errors").innerHTML=`<button class="btn warn" id="pe" style="margin-top:0">🎯 Praticar as ${list.length} questões</button>
   <button class="btn soft" id="ce">Limpar lista de erros</button><h2 class="sec">Para reforçar</h2>`+
   list.map(q=>`<details class="m"><summary><span>${PARTS[q.part].e}</span><b>${esc(q.q)}</b></summary><div class="mbody">
    ${q.t==="open"?"":`<div class="kv">✅ <b>${esc(q.o[q.a])}</b></div>`}<div>${q.x}</div>${calcBtn(q)}</div></details>`).join("");
  $("pe").onclick=()=>startQuiz(null,list);
  $("ce").onclick=()=>{if(confirm("Limpar a lista de erros?")){store.missed=[];save();updateChrome();renderErrors();}};
  bindCalc($("v-errors"));
}

let calcSt={type:"umidade",vals:null};

function openCalc(type,vals,backToQuiz){
  studySeg="calc"; calcSt={type,vals:{...vals}}; fromQuiz=!!backToQuiz; autoplay=true; show("study");
}
function renderCalc(){
  const C=CALCS[calcSt.type];
  if(!calcSt.vals) calcSt.vals={...C.presets[0].v};
  let h=fromQuiz&&quizActive()?`<button class="btn soft mini" id="bq" style="margin:0 0 10px">↩ Voltar ao quiz</button>`:"";
  h+=`<div class="chips">`+Object.entries(CALCS).map(([k,c])=>`<button data-t="${k}" class="${calcSt.type===k?"on":""}">${c.e} ${c.name}</button>`).join("")+`</div>
   <div class="card"><b>${C.e} ${C.name}</b><div class="fml">${C.formula}</div><div style="font-size:14px;color:var(--muted)">${C.desc}</div>
   <h2 class="sec" style="margin-top:12px">Exemplos da prova</h2><div class="chips" style="margin-bottom:0">${C.presets.map((p,i)=>`<button data-p="${i}">${p.l}</button>`).join("")}</div>
   <h2 class="sec">Ou use seus números</h2>
   <div class="fields">${C.fields.map(f=>`<div><label>${f.l}</label><input data-k="${f.k}" inputmode="decimal" value="${calcSt.vals[f.k]===null||calcSt.vals[f.k]===undefined?"":String(calcSt.vals[f.k]).replace(".",",")}"></div>`).join("")}</div>
   <div class="warnmsg hidden" id="cmsg"></div>
   <button class="btn vio" id="anim">▶ Animar a conta</button></div>
   <div id="pbox"><div class="empty" style="padding:18px"><div class="big">🎬</div>Toque em <b>Animar a conta</b> para ver o passo a passo.</div></div>
   <div class="card steps hidden" id="steps"></div>`;
  $("sbody").innerHTML=h;
  if($("bq")) $("bq").onclick=()=>{fromQuiz=false;show("quiz");};
  $("sbody").querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{stopPlayer();calcSt={type:b.dataset.t,vals:null};renderCalc();});
  $("sbody").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{calcSt.vals={...C.presets[+b.dataset.p].v};renderCalc();animate();});
  $("anim").onclick=animate;
  if(autoplay){autoplay=false;animate();}
}
function readVals(C){
  const v={};
  for(const f of C.fields){
    const raw=$("sbody").querySelector(`[data-k="${f.k}"]`).value.trim().replace(",",".");
    if(raw===""){ if(f.opt){v[f.k]=null;continue;} return null; }
    const n=parseFloat(raw); if(!isFinite(n)) return null; v[f.k]=n;
  }
  return v;
}
function animate(){
  const C=CALCS[calcSt.type], v=readVals(C), msg=$("cmsg");
  const err=v===null?"Preencha os campos com números (use vírgula ou ponto).":C.check(v);
  if(err){msg.textContent=err;msg.classList.remove("hidden");return;}
  msg.classList.add("hidden"); calcSt.vals=v;
  mountPlayer($("pbox"),C.scenes(v));
  $("steps").innerHTML=`<b>📝 Passo a passo escrito</b>${C.steps(v)}`; $("steps").classList.remove("hidden");
  setTimeout(()=>$("pbox").scrollIntoView({behavior:"smooth",block:"start"}),60);
}

function cnt(n,unit){ return `<span class="cnt" data-to="${r4(n)}" data-dec="${decs(n)}">${fmt(n)}</span>${unit||""}`; }
function animateCounts(root){
  root.querySelectorAll(".cnt").forEach(el=>{
    const to=parseFloat(el.dataset.to),d=+el.dataset.dec,t0=performance.now();
    const step=t=>{const k=Math.min(1,(t-t0)/900),e=1-Math.pow(1-k,3);
      el.textContent=(to*e).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
      if(k<1&&el.isConnected) requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}

/* ---------- Cenas ---------- */
function scAgua(v,withPct){
  const mi=v.mi,mf=v.mf,w=r4(mi-mf),ratio=w/mi,pct=Math.round(ratio*10000)/100;
  const ap=Math.abs(ratio-r4(ratio))>1e-9?"≈ ":"", ap2=Math.abs(w/mi*100-pct)>1e-9?"≈ ":"";
  const sc=[
   {t:"Pese a amostra úmida",vis:svgScale(mi,"wet"),say:`Antes de secar, a amostra pesa ${N("a",fmt(mi)+" g")}. É a <b>massa inicial</b>.`},
   {t:"Leve à estufa (105 °C)",vis:svgOven("estufa"),say:`A estufa <b>evapora a água</b> da amostra. Ela fica lá até o peso parar de mudar.`,d:6.5},
   {t:"Pese de novo",vis:svgScale(mf,"dry"),say:`Sem a água, a amostra pesa ${N("b",fmt(mf)+" g")}. É a <b>massa final</b>.`},
   {t:"Quanto de água saiu?",d:7,vis:eqs([{h:`Água perdida = massa inicial − massa final`},{h:`Água perdida = ${N("a",fmt(mi))} − ${N("b",fmt(mf))}`},{h:`Água perdida = ${N("r",fmt(w)+" g")}`,cls:"big"}]),say:`O que “sumiu” na estufa foi a água.`}
  ];
  if(!withPct){
    sc.push({t:"Resposta",d:6.5,vis:resBlock(w,"&nbsp;g","Massa de água perdida",100,mbar(mi,w,"água","matéria seca")),say:`Foram perdidos <b>${fmt(w)} g</b> de água.`});
  } else {
    sc.push({t:"A fórmula da umidade",d:6,vis:eqs([{h:`% umidade = ${frac("água perdida","massa inicial")} × 100`,cls:"big"}]),say:`Compare a água perdida com a massa inicial e transforme em porcentagem.`});
    sc.push({t:"Troque pelos números",d:9,vis:eqs([{h:`% umidade = ${frac(N("r",fmt(w)),N("a",fmt(mi)))} × 100`},{h:`% umidade = ${ap}${fmt(ratio)} × 100`},{h:`% umidade = ${N("r",ap2+fmt(pct)+"%")}`,cls:"big"}]),say:`Divida, depois multiplique por 100.`});
    sc.push({t:"Resposta",d:7,vis:resBlock(pct,"%","Teor de umidade",Math.min(100,pct),mbar(mi,w,"água ("+fmt(pct)+"%)","matéria seca")),say:`A amostra tem <b>${ap2}${fmt(pct)}%</b> de umidade.`});
  }
  return sc;
}
function scCinzasMassa(v){
  const {c0,c1,c2}=v, cz=r4(c2-c0), sc=[];
  sc.push({t:"Pese o cadinho vazio",vis:svgScale(c0,"c-empty"),say:`O cadinho vazio pesa ${N("a",fmt(c0)+" g")}.`});
  if(c1!==null) sc.push({t:"Coloque a amostra",vis:svgScale(c1,"c-sample"),say:`Cadinho + amostra = ${fmt(c1)} g, ou seja, a amostra tem ${fmt(c1-c0)} g. <b>Esse valor não entra na conta das cinzas.</b>`,d:7});
  sc.push({t:"Incinere na mufla (550 °C)",vis:svgOven("mufla"),say:`A mufla <b>queima a matéria orgânica</b>. Só o resíduo mineral sobra: as <b>cinzas</b>.`,d:6.5});
  sc.push({t:"Pese cadinho + cinzas",vis:svgScale(c2,"c-ash"),say:`Agora o conjunto cadinho + cinzas pesa ${N("b",fmt(c2)+" g")}.`});
  const lines=[{h:`Cinzas = (cadinho + cinzas) − cadinho vazio`},{h:`Cinzas = ${N("b",fmt(c2))} − ${N("a",fmt(c0))}`},{h:`Cinzas = ${N("r",fmt(cz)+" g")}`,cls:"big"}];
  if(c1!==null) lines.push({h:`⚠️ Não use o ${fmt(c1)} g (cadinho + amostra)!`,cls:"note"});
  sc.push({t:"Subtraia o cadinho",vis:eqs(lines),say:`Tirando o peso do cadinho, sobra só a massa das cinzas.`,d:c1!==null?9:7});
  sc.push({t:"Resposta",d:6,vis:resBlock(cz,"&nbsp;g","Massa de cinzas",100,""),say:`A massa de cinzas é <b>${fmt(cz)} g</b>.`});
  return sc;
}
function scCinzasPct(v){
  const cz=v.cinzas,am=v.amostra,ratio=cz/am,pct=Math.round(ratio*10000)/100;
  const ap=Math.abs(ratio-r4(ratio))>1e-9?"≈ ":"", ap2=Math.abs(ratio*100-pct)>1e-9?"≈ ":"";
  return [
   {t:"Massa da amostra",vis:svgScale(am,"dry"),say:`A amostra inicial pesa ${N("a",fmt(am)+" g")}.`},
   {t:"Incineração na mufla",vis:svgOven("mufla"),say:`Na mufla, a parte orgânica queima e sobram as <b>cinzas</b>.`,d:6.5},
   {t:"Pese as cinzas",vis:svgScale(cz,"ash"),say:`As cinzas pesam ${N("b",fmt(cz)+" g")}.`},
   {t:"A fórmula",d:6,vis:eqs([{h:`% cinzas = ${frac("massa de cinzas","massa da amostra")} × 100`,cls:"big"}]),say:`Compare as cinzas com a massa da amostra.`},
   {t:"Troque pelos números",d:9,vis:eqs([{h:`% cinzas = ${frac(N("b",fmt(cz)),N("a",fmt(am)))} × 100`},{h:`% cinzas = ${ap}${fmt(ratio)} × 100`},{h:`% cinzas = ${N("r",ap2+fmt(pct)+"%")}`,cls:"big"}]),say:`Divida, depois multiplique por 100.`},
   {t:"Resposta",d:7,vis:resBlock(pct,"%","Teor de cinzas",Math.min(100,pct),mbar(am,cz,"cinzas ("+fmt(pct)+"%)","parte orgânica e água","ash")),say:`A amostra tem <b>${ap2}${fmt(pct)}%</b> de cinzas.`}
  ];
}

/* ---------- Player (vídeo curto) ---------- */
const P={scenes:[],i:0,playing:false,timer:null,speed:1,rem:0,t0:0,box:null};
function stopPlayer(){ clearTimeout(P.timer); P.timer=null; if(P.playing){P.playing=false;} const pl=document.getElementById("player"); if(pl) pl.classList.add("paused"); const b=document.getElementById("pplay"); if(b) b.textContent="▶"; }
function mountPlayer(box,scenes){
  clearTimeout(P.timer); P.box=box; P.scenes=scenes; P.i=0; P.playing=true;
  box.innerHTML=`<div class="player" id="player"><div class="stitle"><span id="ptitle"></span><span id="pcount"></span></div>
   <div class="screen" id="pscreen"></div><div class="segs" id="psegs"></div>
   <div class="ctrl"><button class="cb" id="pprev" aria-label="Anterior">⏮</button><button class="cb big" id="pplay" aria-label="Pausar">⏸</button><button class="cb" id="pnext" aria-label="Próxima">⏭</button><button class="cb sp" id="pspeed">${P.speed===1?"1×":"0,5×"}</button></div></div>`;
  $("pprev").onclick=()=>{P.playing=true;go(Math.max(0,P.i-1));};
  $("pnext").onclick=()=>{P.playing=true;go(Math.min(P.scenes.length-1,P.i+1));};
  $("pspeed").onclick=()=>{P.speed=P.speed===1?0.5:1;$("pspeed").textContent=P.speed===1?"1×":"0,5×";P.playing=true;go(P.i);};
  $("pplay").onclick=togglePlay;
  go(0);
}
function schedule(ms){
  clearTimeout(P.timer); P.rem=ms; P.t0=performance.now();
  P.timer=setTimeout(()=>{ if(P.i<P.scenes.length-1) go(P.i+1); else {P.playing=false;$("pplay").textContent="🔁";$("player").classList.add("paused");} },ms);
}
function go(i){
  const sc=P.scenes[i]; P.i=i;
  const dur=(sc.d||5.5)/P.speed;
  $("pscreen").innerHTML=`<div class="scene">${sc.vis}<div class="cap">${sc.say}</div></div>`;
  $("ptitle").textContent=`${i+1}. ${sc.t}`; $("pcount").textContent=`Cena ${i+1} de ${P.scenes.length}`;
  $("psegs").innerHTML=P.scenes.map((_,k)=>`<button data-i="${k}" class="${k<i?"done":k===i?"cur":""}" style="--d:${dur}s" aria-label="Cena ${k+1}"><i></i></button>`).join("");
  $("psegs").querySelectorAll("button").forEach(b=>b.onclick=()=>{P.playing=true;go(+b.dataset.i);});
  animateCounts($("pscreen"));
  const pl=$("player");
  if(P.playing){ pl.classList.remove("paused"); $("pplay").textContent="⏸"; schedule(dur*1000); }
  else { clearTimeout(P.timer); pl.classList.add("paused"); $("pplay").textContent="▶"; }
}
function togglePlay(){
  const pl=$("player");
  if(P.playing){ P.playing=false; clearTimeout(P.timer); P.rem=Math.max(300,P.rem-(performance.now()-P.t0)); pl.classList.add("paused"); $("pplay").textContent="▶"; }
  else {
    const atEnd=$("pplay").textContent==="🔁";
    P.playing=true;
    if(atEnd){ go(0); return; }
    pl.classList.remove("paused"); $("pplay").textContent="⏸"; schedule(P.rem||2000);
  }
}
