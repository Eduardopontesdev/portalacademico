<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Química Geral – Configuração, período e massa molar</title>
<style>

:root{
  --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#0f766e; --brand2:#14b8a6; --brand-soft:#ccfbf1;
  --ok:#059669; --ok-soft:#d1fae5; --err:#e11d48; --err-soft:#ffe4e6;
  --o:#2563eb; --o-soft:#dbeafe; --a:#7c3aed; --a-soft:#ede9fe; --warn:#d97706; --warn-soft:#fef3c7;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 14px rgba(15,23,42,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1220; --card:#131c2e; --text:#e5edf7; --muted:#94a3b8; --line:#243049;
    --brand:#14b8a6; --brand2:#2dd4bf; --brand-soft:#0f2f2c;
    --ok:#34d399; --ok-soft:#08302a; --err:#fb7185; --err-soft:#3a1420;
    --o:#60a5fa; --o-soft:#13243f; --a:#a78bfa; --a-soft:#251c45; --warn:#fbbf24; --warn-soft:#3a2a0a;
    --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hidden{display:none!important}
#app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}

.top{padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 16px;background:linear-gradient(135deg,#0f766e,#115e59 60%,#134e4a);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(15,118,110,.25);flex-shrink:0}
.logo{display:flex;align-items:center;gap:11px}
.logo .ic{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:22px}
.logo h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.01em}
.logo p{margin:0;font-size:12px;opacity:.8}
.chip{background:rgba(255,255,255,.16);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap}

main{flex:1;overflow-y:auto;padding:16px 16px 24px;-webkit-overflow-scrolling:touch}
.view{animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 8px);flex-shrink:0}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:14px;color:var(--muted);font-size:11.5px;font-weight:700;position:relative}
.tab .e{font-size:21px;line-height:1.1}
a.tab{text-decoration:none}
.tab.on{color:var(--brand);background:var(--brand-soft)}
.badge{position:absolute;top:2px;right:calc(50% - 20px);background:var(--err);color:#fff;border-radius:999px;font-size:10px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 4px 9px;font-weight:800}
h2.sec:first-child{margin-top:4px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

.seg{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:14px;border:1px solid var(--line)}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}

.regions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.region{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;text-align:left;box-shadow:var(--shadow);transition:transform .1s}
.region:active{transform:scale(.97)}
.region.all{grid-column:1/-1;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border:0}
.region.vid{grid-column:1/-1;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:0;display:flex;align-items:center;gap:12px}
.region.vid .me{font-size:30px}
.region b{display:block;font-size:15px}
.region small{font-size:12px;color:var(--muted)}
.region.all small,.region.vid small{color:rgba(255,255,255,.88)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:99px;transition:width .3s}
.region.all .bar{background:rgba(255,255,255,.3)}
.region.all .bar i{background:#fff}

.btn{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:15.5px;background:var(--brand);color:#fff;margin-top:10px;box-shadow:0 4px 12px rgba(15,118,110,.25)}
.btn.dark{background:var(--text);color:var(--bg);box-shadow:none}
.btn.soft{background:var(--bg);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.warn{background:#f59e0b}
.btn.vio{background:linear-gradient(135deg,#7c3aed,#2563eb)}
.btn:disabled{opacity:.45}
.btn.mini{padding:10px;font-size:14px;margin-top:8px}

/* Quiz */
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.x{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px;flex-shrink:0}
.prog{flex:1}
.prog .bar{height:10px;margin:0}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
.pill{display:inline-block;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:12px;padding:4px 11px;border-radius:99px;margin-bottom:10px}
.qtext{font-size:17.5px;font-weight:800;margin:4px 0 14px;line-height:1.4}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:11px;align-items:center;text-align:left;padding:12px 13px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-weight:600;font-size:14.5px}
.opt .lt{width:28px;height:28px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--muted);flex-shrink:0}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .lt{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--err);background:var(--err-soft)} .opt.bad .lt{background:var(--err);color:#fff}
textarea.ans{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:15px;outline:none;resize:vertical;min-height:120px}
textarea.ans:focus{border-color:var(--brand)}

.fb{margin-top:14px;border-radius:18px;padding:15px;border:2px solid;animation:in .25s}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--err-soft);border-color:var(--err)}
.fb.neu{background:var(--brand-soft);border-color:var(--brand)}
.fbh{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.fbi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex-shrink:0}
.ok .fbi{background:var(--ok)} .bad .fbi{background:var(--err)} .neu .fbi{background:var(--brand)}
.fbh small{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.ok .fbh small{color:var(--ok)} .bad .fbh small{color:var(--err)} .neu .fbh small{color:var(--brand)}
.fbh b{font-size:16px;line-height:1.3}
.tip{margin-top:8px;font-size:14px;background:var(--card);border-radius:12px;padding:10px 12px}
.tip small{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.attempt{font-size:13px;color:var(--muted);margin:-2px 0 8px}
.attempt s{color:var(--err);font-weight:700}
.model{background:var(--card);border-left:5px solid var(--brand);border-radius:12px;padding:11px 13px;font-size:14px;margin-top:12px}
.model small{display:block;font-size:11px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.result{text-align:center}
.trophy{font-size:56px;margin:4px 0}
.result h2{margin:0;font-size:24px}
.result p{color:var(--muted);margin:4px 0 14px}
.rs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.rs div{border-radius:14px;padding:12px 4px}
.rs b{display:block;font-size:24px}
.rs span{font-size:11px;font-weight:800;text-transform:uppercase}
.brk{text-align:left;margin:10px 0}
.brk div{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;padding:6px 0;border-bottom:1px dashed var(--line)}

.warnmsg{color:var(--warn);font-size:13px;font-weight:700;margin:8px 2px 0}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty .big{font-size:44px}
.banner{display:flex;align-items:center;gap:12px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:16px;padding:12px 14px;margin-bottom:12px;width:100%;text-align:left}
.banner b{display:block;font-size:14px}
.banner small{color:var(--muted)}

/* Estudo */
details.m{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:9px;box-shadow:var(--shadow);overflow:hidden}
details.m summary{list-style:none;padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.m summary::-webkit-details-marker{display:none}
details.m summary b{flex:1;font-size:15px}
details.m summary::after{content:"›";font-size:22px;color:var(--muted);transition:transform .2s}
details.m[open] summary::after{transform:rotate(90deg)}
.mbody{padding:0 14px 14px;font-size:14.5px}
.mbody ul{margin:6px 0;padding-left:20px}
.mbody li{margin:4px 0}
.mbody p{margin:6px 0}
.kv{background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0}
.tl>div{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.tl b{min-width:50px;color:var(--brand)}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
table.tb th,table.tb td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fml{font-size:16px;font-weight:800;background:var(--brand-soft);color:var(--brand);border-radius:12px;padding:10px 12px;margin:8px 0}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.fields label{font-size:12px;font-weight:800;color:var(--muted);display:block;margin-bottom:4px}
.fields input{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px;font-weight:700;outline:none}
.fields input:focus{border-color:var(--brand)}
.steps ol{margin:6px 0;padding-left:20px;font-size:14.5px}
.steps li{margin:6px 0}

/* Player de animação */
.player{margin-top:6px}
.stitle{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;margin-bottom:8px}
.stitle span:last-child{color:var(--muted);font-size:12px}
.screen{background:linear-gradient(180deg,var(--brand-soft),var(--card));border:1px solid var(--line);border-radius:20px;padding:14px;min-height:310px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.scene{animation:in .45s ease-out;display:flex;flex-direction:column;gap:10px}
.cap{text-align:center;font-size:15px;font-weight:600;padding:0 4px}
.vis{width:100%;max-height:215px}
.segs{display:flex;gap:4px;margin:12px 0 8px}
.segs button{flex:1;height:8px;border-radius:9px;background:var(--line);position:relative;overflow:hidden;padding:0}
.segs button i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--brand2)}
.segs button.done i{width:100%}
.segs button.cur i{animation:fillseg var(--d,5s) linear forwards}
@keyframes fillseg{to{width:100%}}
.paused .segs button.cur i,.paused .screen *{animation-play-state:paused!important}
.ctrl{display:flex;gap:10px;justify-content:center;align-items:center}
.cb{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:18px;box-shadow:var(--shadow)}
.cb.big{width:58px;height:58px;background:var(--brand);color:#fff;font-size:22px;border:0}
.cb.sp{font-size:13px;font-weight:800;width:52px;border-radius:23px}

.sc-body{fill:#334155}.sc-screen{fill:#0f172a}.sc-plate{fill:#94a3b8}
.sc-num{fill:#4ade80;font:700 17px ui-monospace,Menlo,monospace}
.drop{animation:rise 1.8s infinite ease-in}
@keyframes rise{0%{transform:translateY(0);opacity:0}25%{opacity:.95}100%{transform:translateY(-38px);opacity:0}}
.smoke{transform-box:fill-box;transform-origin:center;animation:rise2 2.4s infinite ease-out}
@keyframes rise2{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.75}100%{transform:translateY(-48px) scale(1.5);opacity:0}}
.glow{animation:glow 1.1s infinite alternate}
@keyframes glow{from{opacity:.5}to{opacity:1}}
.s-dry{animation:dry 3.2s ease forwards}
@keyframes dry{from{fill:#7fb069}to{fill:#c9a46a}}
.s-burn{animation:burn 3.4s ease forwards}
@keyframes burn{from{fill:#7fb069}55%{fill:#3f3f46}to{fill:#9ca3af}}
.pulse{animation:pulse 1s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}

.eqs{display:grid;gap:10px;text-align:center}
.eq{font-size:19px;font-weight:700;opacity:0;animation:fadeup .6s forwards;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px}
.eq.big{background:var(--brand);color:#fff;border:0}
.eq.note{background:var(--warn-soft);border-color:var(--warn);font-size:14px;font-weight:600}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.n-a{color:var(--o)}.n-b{color:var(--a)}.n-r{color:var(--ok)}
.big .n-r,.big .n-a,.big .n-b{color:#fff}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 6px;font-size:.92em}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 8px 2px}
.frac>span:last-child{padding:2px 8px 0}

.res{text-align:center}
.ring{width:140px;height:140px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:conic-gradient(var(--ok) var(--p,100%),var(--line) 0);animation:pop .8s cubic-bezier(.2,1.6,.4,1)}
.ring>div{width:108px;height:108px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:28px;font-weight:800}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.reslabel{font-weight:800;margin:8px 0}
.mbwrap{margin-top:8px}
.mbar{display:flex;height:42px;border-radius:13px;overflow:hidden;border:2px solid var(--line);background:var(--bg)}
.mbar .solid{background:#c9a46a;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.mbar .part{background:#38bdf8;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;animation:growx 1.1s .3s ease-out backwards}
.mbar .part.ash{background:#6b7280}
@keyframes growx{from{width:0}}
.legend{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-top:7px;gap:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:5px;background:#c9a46a}
.legend i.w{background:#38bdf8}.legend i.ash{background:#6b7280}
.mtot{text-align:center;font-size:13px;color:var(--muted);margin-top:4px}


/* ===================== Química Geral ===================== */
.tabs{grid-template-columns:repeat(5,1fr)}
a.tab{text-decoration:none}
.tab{font-size:10.5px}
.tscroll{overflow-x:auto}
.logo .ic{flex-shrink:0}
@keyframes appear{from{opacity:0}to{opacity:1}}
.appear{opacity:0;animation:appear .5s forwards}
.mono{font-family:ui-monospace,Menlo,monospace}

/* categorias da tabela periódica */
.c-hid{--cc:#bfdbfe}.c-alc{--cc:#fca5a5}.c-alt{--cc:#fdba74}.c-tra{--cc:#fde047}.c-lan{--cc:#f9a8d4}.c-act{--cc:#f0abfc}
.c-out{--cc:#d9f99d}.c-sem{--cc:#5eead4}.c-ame{--cc:#86efac}.c-hal{--cc:#c4b5fd}.c-nob{--cc:#a5b4fc}

.tile{width:84px;min-width:84px;height:94px;border-radius:14px;background:var(--cc,#e2e8f0);color:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:var(--shadow)}
.tile i{position:absolute;left:8px;top:6px;font-style:normal;font-size:12px;font-weight:800;opacity:.75}
.tile b{font-size:34px;line-height:1;font-weight:800}
.tile span{font-size:11px;font-weight:700;margin-top:4px;opacity:.85;text-align:center;padding:0 2px}
.tile.big{width:96px;height:106px}
.tile.big b{font-size:40px}
.elcard{display:flex;gap:14px;align-items:center}
.elinfo{font-size:14px;line-height:1.5;min-width:0}
.elinfo b.nm{font-size:19px;display:block}
.elinfo .cfgline{margin-top:4px;font-size:13px;color:var(--brand);font-weight:700;word-break:break-word}

.hero{display:flex;gap:14px;align-items:center;justify-content:center}
.hero .eqs{flex:1;min-width:0}
.hero .eq{font-size:15px;padding:8px 6px}

/* subníveis */
.subs{display:grid;gap:9px}
.subrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.subrow>b{width:32px;height:32px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:17px;flex-shrink:0}
.orbs{display:flex;gap:3px;flex-wrap:wrap}
.orb{border:2px solid var(--brand);border-radius:6px;font-size:11px;font-weight:800;padding:2px 3px;color:var(--brand);background:var(--brand-soft)}
.subrow em{margin-left:auto;font-style:normal;font-size:12.5px;color:var(--muted);text-align:right}
.subrow em strong{color:var(--text)}

/* Diagrama de Pauling */
.vis.pau{max-height:255px}
.vis.atom{max-height:235px}
.pchip{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.pchip.lit{fill:var(--brand-soft);stroke:var(--brand);stroke-width:2}
.pchip.last{fill:#fde68a;stroke:#f59e0b;stroke-width:2}
.ptxt{font:700 12px system-ui,sans-serif;fill:var(--text);text-anchor:middle;dominant-baseline:central}
.ptxt.dim{fill:var(--muted);font-weight:600}
.pnum{font:800 8.5px system-ui,sans-serif;fill:#b45309}
.parrow{stroke:#f59e0b;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .8s forwards}
.parrow.faint{opacity:.28;stroke-dashoffset:0;animation:none}
@keyframes draw{to{stroke-dashoffset:0}}
.phead{fill:#f59e0b;opacity:0;animation:appear .3s forwards}
.totwrap{position:relative;height:38px;margin-top:6px}
.tot{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;opacity:0;animation:appear .25s forwards}
.tot b{color:var(--brand);font-size:17px}

  $("psegs").querySelectorAll("button").forEach(b=>b.onclick=()=>{P.playing=true;go(+b.dataset.i);});
  animateCounts($("pscreen"));
  const pl=$("player");
  if(P.playing){ pl.classList.remove("paused"); $("pplay").textContent="⏸"; schedule(dur*1000); }
  else { clearTimeout(P.timer); pl.classList.add("paused"); $("pplay").textContent="▶"; }
}
function togglePlay(){
  const pl=$("player");
  if(P.playing){ P.playing=false; clearTimeout(P.timer); P.rem=Math.max(300,P.rem-(performance.now()-P.t0)); pl.classList.add("paused"); $("pplay").textContent="▶"; }
  else {
    const atEnd=$("pplay").textContent==="🔁";
    P.playing=true;
    if(atEnd){ go(0); return; }
    pl.classList.remove("paused"); $("pplay").textContent="⏸"; schedule(P.rem||2000);
  }
}

const tile=(el,big)=>`<div class="tile c-${el.cat} ${big?"big":""}"><i>${el.Z}</i><b>${el.s}</b><span>${el.n}</span></div>`;

function ptable(o){
  o=o||{}; const sel=o.sel||null, mini=!!o.mini, hl=o.hl!==false&&!!sel, anim=!!o.anim;
  const grid=[]; for(let p=0;p<7;p++) grid.push(new Array(18).fill(null));
  E.forEach(e=>{ if(!e.f) grid[e.per-1][e.grp-1]=e; });
  const cell=(e,extra)=>{
    let cls=`pc c-${e.cat}`;
    if(sel){ if(sel.Z===e.Z) cls+=" me"; else if(hl&&!e.f&&!sel.f&&e.per===sel.per) cls+=" rh"; else if(hl&&!e.f&&!sel.f&&e.grp===sel.grp) cls+=" ch"; }
    return mini?`<div class="${cls}"><i>${e.Z}</i><b>${e.s}</b></div>`:`<button class="${cls}" data-z="${e.Z}" aria-label="${esc(e.n)}"><i>${e.Z}</i><b>${e.s}</b></button>`;
  };
  let h=`<div class="ptab ${mini?"mini":""} ${anim?"anim":""}"><div class="gh"></div>`;
  for(let g=1;g<=18;g++) h+=`<div class="gh ${sel&&!sel.f&&sel.grp===g&&hl?"on":""}">${g}</div>`;
  for(let p=1;p<=7;p++){
    h+=`<div class="gh ${sel&&sel.per===p&&hl&&!sel.f?"on":""}">${p}</div>`;
    for(let g=1;g<=18;g++){
      const e=grid[p-1][g-1];
      if(e) h+=cell(e);
      else if(g===3&&p===6) h+=`<div class="pc ph c-lan">57–71</div>`;
      else if(g===3&&p===7) h+=`<div class="pc ph c-act">89–103</div>`;
      else h+=`<div class="pc empty"></div>`;
    }
  }
  h+=`<div class="gh" style="grid-column:1/-1;min-height:4px"></div>`;
  [[57,71,"lan"],[89,103,"act"]].forEach(([a,b])=>{
    h+=`<div class="gh">${a===57?"6":"7"}</div><div class="pc empty"></div><div class="pc empty"></div>`;
    for(let z=a;z<=b;z++) h+=cell(E[z-1]);
    h+=`<div class="pc empty"></div>`;
  });
  return h+`</div>`;
}

/* Diagrama de Pauling (SVG) */
function svgPauling(cfg,mode){
  const X=l=>14+l*76, Y=n=>12+(n-1)*31, W=64, H=24;
  const ctr=(n,l)=>[X(l)+W/2,Y(n)+H/2];
  let s=`<svg class="vis pau" viewBox="0 0 312 236" role="img" aria-label="Diagrama de Pauling">`;
  ORDER.forEach(([n,l])=>{ s+=`<rect class="pchip" x="${X(l)}" y="${Y(n)}" width="${W}" height="${H}" rx="8"/>`; });
  // setas diagonais (n + l constante)
  const groups={}; ORDER.forEach(([n,l],i)=>{ (groups[n+l]=groups[n+l]||[]).push({n,l,i}); });
  Object.keys(groups).map(Number).sort((a,b)=>a-b).forEach((k,gi)=>{
    const g=groups[k].sort((a,b)=>a.n-b.n), a=ctr(g[0].n,g[0].l), b=ctr(g[g.length-1].n,g[g.length-1].l);
    const x1=a[0]+34, y1=a[1]-14, x2=b[0]-34, y2=b[1]+14;
    const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, px=-uy, py=ux;
    const delay=(.4+gi*.9);
    if(mode==="arrows"){
      s+=`<path class="parrow" pathLength="100" d="M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}" style="animation-delay:${delay}s"/>`;
      const bx=x2-ux*9, by=y2-uy*9;
      s+=`<polygon class="phead" style="animation-delay:${(delay+.7).toFixed(2)}s" points="${x2.toFixed(1)},${y2.toFixed(1)} ${(bx+px*4.5).toFixed(1)},${(by+py*4.5).toFixed(1)} ${(bx-px*4.5).toFixed(1)},${(by-py*4.5).toFixed(1)}"/>`;
    } else {
      s+=`<path class="parrow faint" d="M${x1.toFixed(1)} ${y1.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}"/>`;
    }
  });
  const used=cfg.map((c,i)=>({c,i})).filter(o=>o.c.e>0); const lastUsed=used.length?used[used.length-1].i:-1;
  let step=0;
  ORDER.forEach(([n,l],i)=>{
    const c=cfg[i], cx=X(l)+W/2, cy=Y(n)+H/2, name=n+LET[l], cap=2*(2*l+1);
    if(mode==="arrows"){
      const gi=Object.keys(groups).map(Number).sort((a,b)=>a-b).indexOf(n+l), d=(.4+gi*.9+.35).toFixed(2);
      s+=`<text class="ptxt dim" x="${cx}" y="${cy}">${name}</text><text class="pnum appear" style="animation-delay:${d}s" x="${X(l)+6}" y="${Y(n)+9}">${i+1}º</text>`;
    } else if(c.e>0){
      const d=(.5+step*.8).toFixed(2); step++;
      const incompl=c.e<cap&&i===lastUsed;
      s+=`<g class="appear" style="animation-delay:${d}s"><rect class="pchip ${incompl?"last":"lit"}" x="${X(l)}" y="${Y(n)}" width="${W}" height="${H}" rx="8"/><text class="ptxt" x="${cx}" y="${cy}">${name}${sup(c.e)}</text></g>`;
    } else {
      s+=`<text class="ptxt dim" x="${cx}" y="${cy}">${name}</text>`;
    }
  });
  return s+`</svg>`;
}

/* Átomo com camadas (SVG) */
function svgAtom(el,cfg,opt){
  opt=opt||{}; const sh=shells(cfg), nmax=sh.length, R=n=>20+n*15, cx=130, cy=130;
  let s=`<svg class="vis atom" viewBox="0 0 260 260" role="img" aria-label="Átomo com camadas">`;
  for(let n=1;n<=nmax;n++) s+=`<circle cx="${cx}" cy="${cy}" r="${R(n)}" fill="none" stroke="${n===nmax?"#f59e0b":"var(--line)"}" stroke-width="${n===nmax?2.4:1.6}"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="15" fill="var(--brand)"/><text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="800" font-size="13">${el.s}</text>`;
  let k=0; const per=Math.min(.09,6/Math.max(el.Z,1));
  for(let n=1;n<=nmax;n++){
    const c=sh[n-1];
    for(let i=0;i<c;i++){
      const a=-Math.PI/2+2*Math.PI*i/c+n*.35, x=cx+R(n)*Math.cos(a), y=cy+R(n)*Math.sin(a);
      s+=`<circle class="appear" style="animation-delay:${(.4+k*per).toFixed(2)}s" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.3" fill="${n===nmax?"#f59e0b":"#38bdf8"}" stroke="#fff" stroke-width="1"/>`; k++;
    }
  }
  return s+`</svg>`;
}

/* =====================  MASSA MOLAR  ===================== */
const PAL=["#2563eb","#7c3aed","#059669","#d97706","#e11d48","#0891b2","#65a30d","#c026d3"];
function parseFormula(str){
  let s=String(str||"").replace(/\s+/g,"").replace(/[₀-₉]/g,c=>SUBD.indexOf(c)).replace(/[\[{]/g,"(").replace(/[\]}]/g,")");
  if(!s) throw new Error("Digite uma fórmula, por exemplo H2O.");
  const total={}, order=[], add=(sym,k)=>{ if(!(sym in total)){ total[sym]=0; order.push(sym);} total[sym]+=k; };
  s.split(/[·.*•]/).forEach(seg=>{
    if(!seg) return;
    let coef=1; const mc=/^(\d+)/.exec(seg); if(mc){ coef=parseInt(mc[1],10); seg=seg.slice(mc[1].length); }
    let i=0;
    const num=()=>{ const m=/^\d+/.exec(seg.slice(i)); if(m){ i+=m[0].length; return parseInt(m[0],10); } return 1; };
    function group(){
      const cn={}, put=(k,v)=>{cn[k]=(cn[k]||0)+v;};
      while(i<seg.length){
        const c=seg[i];
        if(c==="("){ i++; const inner=group(); if(seg[i]!==")") throw new Error("Falta fechar um parêntese )."); i++; const k=num(); Object.keys(inner).forEach(e=>put(e,inner[e]*k)); }
        else if(c===")"){ return cn; }
        else if(/[A-Z]/.test(c)){ let sym=c; i++; if(i<seg.length&&/[a-z]/.test(seg[i])){ sym+=seg[i]; i++; }
          if(!BYS[sym]) throw new Error(`Elemento desconhecido: “${sym}”. Lembre: a 1ª letra é maiúscula e a 2ª minúscula (Co ≠ CO).`);
          put(sym,num()); }
        else throw new Error(`Caractere inválido: “${c}”.`);
      }
      return cn;
    }
    const cn=group(); if(i<seg.length) throw new Error("Há um parêntese ) sem abrir.");
    Object.keys(cn).forEach(e=>add(e,cn[e]*coef));
  });
  if(!order.length) throw new Error("Não encontrei elementos na fórmula.");
  return order.map(sym=>({sym,k:total[sym]}));
}
function fmtFormula(str){
  let s=String(str).replace(/\s+/g,"").replace(/[\[{]/g,"(").replace(/[\]}]/g,")").replace(/[.*•]/g,"·");
  return s.replace(/([A-Za-z\)])(\d+)/g,(m,a,d)=>a+sub(d));
}
const SPECIAL_PROVA={Cl:35.5,Cu:63.5};
const massOf=(sym,prova)=>{ const e=BYS[sym]; return prova?(SPECIAL_PROVA[sym]!==undefined?SPECIAL_PROVA[sym]:Math.round(e.m)):e.m; };
function sciNote(x){ if(!isFinite(x)||x===0) return "0"; const e=Math.floor(Math.log10(Math.abs(x))), m=x/Math.pow(10,e); return `${m.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})} × 10${sup(e)}`; }
function calcMol(f,prova){
  const parts=parseFormula(f); let total=0;
  const rows=parts.map((p,i)=>{ const m=massOf(p.sym,prova), sub=r3(p.k*m); total=r3(total+sub); return {sym:p.sym,k:p.k,m,sub,color:PAL[i%PAL.length]}; });
  return {rows,total};
}
function scMol(f,prova,grams,rd){
  const {rows,total}=calcMol(f,prova), F=fmtFormula(f), sc=[];
  const hasRd=(rd!==null&&rd!==undefined), shown=hasRd?roundTo(total,rd):total;
  const hasPar=/[\(\[\{]/.test(f), hasHyd=/[·.*•]/.test(f);
  sc.push({t:"O que é massa molar?",d:10,
    vis:eqs([{h:`1 mol = ${N("a","6,02 × 10²³")} partículas`},{h:`Massa atômica (u) = massa molar (g/mol)<br><small>Na: 23 u → ${N("r","23 g/mol")}</small>`},{h:`Massa molar = ${N("r","massa de 1 mol")}`,cls:"big"}],.3),
    say:`A <b>massa molar (M)</b> diz quantos <b>gramas</b> pesa <b>1 mol</b> da substância. Para uma fórmula, <b>somamos as massas atômicas</b> de todos os átomos.`});
  sc.push({t:"Separe os elementos",d:Math.max(8,4+rows.length*.8),
    vis:`<div class="formula">${rows.length?F:""}</div><div class="els" style="margin-top:12px">${rows.map((r,i)=>`<span class="elchip" style="background:${r.color};animation-delay:${(.5+i*.7).toFixed(1)}s">${r.sym}<small>× ${r.k}</small></span>`).join("")}</div>`,
    say:`Veja <b>quais elementos</b> aparecem e <b>quantos átomos</b> de cada. O número pequeno vale para o átomo à esquerda.`+(hasPar?` O número <b>depois do parêntese</b> multiplica tudo que está dentro.`:"")+(hasHyd?` Na água de hidratação (·), o número à frente multiplica todo o grupo.`:"")});
  sc.push({t:"Procure as massas atômicas",d:Math.max(8,4+rows.length*.8),
    vis:`<div class="tiles">${rows.map((r,i)=>{const e=BYS[r.sym];return `<div class="tile c-${e.cat}" style="animation-delay:${(.3+i*.7).toFixed(1)}s"><i>${e.Z}</i><b>${e.s}</b><span>${e.n}</span><em>${fmt(r.m)} u</em></div>`;}).join("")}</div>`,
    say:`Na tabela periódica, a <b>massa atômica</b> fica embaixo do símbolo. ${prova?"Aqui usamos valores <b>arredondados</b> (como em prova).":"Aqui usamos os valores <b>exatos</b> da tabela."}`});
  sc.push({t:"Multiplique pela quantidade",d:Math.max(8,rows.length*1.1+4),
    vis:eqs(rows.map(r=>({h:`${N("a",r.sym)}: ${N("b",r.k)} × ${N("a",fmt(r.m))} = ${N("r",fmt(r.sub))}`})),.3),
    say:`Para cada elemento: <b>quantidade × massa atômica</b>.`});
  const sumTxt=rows.map(r=>fmt(r.sub)).join(" + ");
  sc.push({t:"Some tudo",d:8,
    vis:eqs([{h:`M = ${sumTxt}`},{h:`M = ${N("r",fmt(total)+" g/mol")}`,cls:"big"}],.4),
    say:`A soma de todas as parcelas é a <b>massa molar</b>.`});
  if(hasRd){
    const dg=nextDigit(total,rd);
    sc.push({t:"Arredonde o valor",d:12,
      vis:eqs([{h:`Valor calculado: ${N("a",fmt(total)+" g/mol")}`},{h:`Manter: ${N("b",rndTxt(rd))}`},{h:`Próximo algarismo: ${N("b",dg)} ${dg>=5?"(5 ou mais → aumenta 1)":"(menor que 5 → não muda)"}`},{h:`M ≈ ${N("r",fmtFix(shown,rd)+" g/mol")}`,cls:"big"}],.3),
      say:`<b>Regra:</b> olhe o algarismo logo depois da casa que você vai manter. Se for <b>5 ou mais</b>, o último algarismo mantido sobe 1; se for <b>menor que 5</b>, ele não muda.`});
  }
  sc.push({t:"Resultado",d:9,
    vis:`<div class="res"><div class="ring" style="--p:100%"><div><span>${cnt(shown)}</span></div></div><div class="reslabel">g/mol de ${F}${hasRd?" (arredondado)":""}</div>
      <div class="stack">${rows.map(r=>`<div style="width:${(r.sub/total*100).toFixed(2)}%;background:${r.color}">${r.sub/total>.1?r.sym:""}</div>`).join("")}</div>
      <div class="legend" style="flex-wrap:wrap;justify-content:center;gap:10px">${rows.map(r=>`<span style="display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700"><i style="display:inline-block;width:11px;height:11px;border-radius:4px;background:${r.color}"></i>${r.sym} ${(r.sub/total*100).toFixed(1).replace(".",",")}%</span>`).join("")}</div></div>`,
    say:`Em <b>1 mol</b> de ${F} há ${hasRd?"≈ ":""}<b>${hasRd?fmtFix(shown,rd):fmt(total)} g</b>. A barra mostra quanto cada elemento contribui.`});
  if(grams&&grams>0){
    const n=grams/total, nn=n*6.02e23;
    sc.push({t:"Bônus: quantos mols?",d:10,
      vis:eqs([{h:`n = ${frac("m","M")}`},{h:`n = ${frac(N("a",fmt(grams)+" g"),N("b",fmt(total)+" g/mol"))} = ${N("r",fmt(n)+" mol")}`,cls:"big"},{h:`Partículas = n × 6,02×10²³ ≈ ${N("r",sciNote(nn))}`}],.3),
      say:`Com a <b>massa molar</b> você converte <b>gramas em mols</b>: n = m ÷ M.`});
  }
  return sc;
}

/* =====================  TREINAR (perguntas)  ===================== */
function rnd(n){ if(window.crypto&&crypto.getRandomValues){const u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]%n;} return Math.floor(Math.random()*n); }
const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=rnd(i+1);[r[i],r[j]]=[r[j],r[i]];}return r;};
const pick=a=>a[rnd(a.length)];
function uniqOpts(ok,cands,n){ const out=[ok]; for(const c of cands){ if(out.length>=n) break; if(c!==undefined&&c!==null&&!out.includes(c)) out.push(c); } return out; }
const POOLC=E.filter(e=>e.Z>=3&&e.Z<=54&&!EXC[e.Z]);
const POOLG=E.filter(e=>e.Z>=3&&e.Z<=54&&e.Z!==46);
const NUMS=[74.092,58.44,18.015,35.45,63.546,44.009,180.156,98.079,342.132,100.087,17.031,36.46,159.609,249.68,40.0,58.319,46.069,132.14];

function qCfg(){
  const el=pick(POOLC), cfg=config(el.Z), ok=strE(cfg);
  const c=shuffle([el.Z-1,el.Z+1,el.Z+2,el.Z-2].filter(z=>z>=1).map(z=>strE(config(z))));
  const o=shuffle(uniqOpts(ok,c,4));
  return {cat:"cfg",q:`Qual é a distribuição eletrônica (em ordem de energia) do ${el.n} (Z = ${el.Z})?`,o,a:o.indexOf(ok),
    x:`Preencha na ordem das setas de Pauling até ter <b>${el.Z} elétrons</b>: <span class="mono">${ok}</span>.`,anim:{k:"cfg",z:el.Z}};
}
function qAbbr(){
  const el=pick(POOLG), cfg=config(el.Z), ok=abbrE(el.Z,cfg), g=nobleCore(el.Z);
  const wrong=[];
  NOBLES.filter(n=>n[0]<el.Z&&n[1]!==g[1]).forEach(n=>{ const k=config(n[0],false); wrong.push(`[${n[1]}] `+cfg.map((c,i)=>Object.assign({},c,{e:c.e-k[i].e})).filter(c=>c.e>0).map(part).join(" ")); });
  [el.Z-2,el.Z-1,el.Z+1,el.Z+2].filter(z=>z>2&&z<=118).forEach(z=>wrong.push(abbrE(z,config(z))));
  const o=shuffle(uniqOpts(ok,shuffle(wrong),4));
  return {cat:"abbr",q:`Qual é a distribuição eletrônica abreviada (com gás nobre) do ${el.n} (Z = ${el.Z})?`,o,a:o.indexOf(ok),
    x:`O gás nobre anterior é o <b>${g[1]}</b> (Z = ${g[0]}): ele resume os ${g[0]} primeiros elétrons. Sobram ${el.Z-g[0]}: <span class="mono">${ok}</span>.`,anim:{k:"cfg",z:el.Z}};
}
function qNoble(){
  const el=pick(E.filter(e=>e.Z>=3&&e.Z<=86&&!e.f)), g=nobleCore(el.Z);
  const o=shuffle(uniqOpts(`${g[2]} (${g[1]})`,shuffle(NOBLES.filter(n=>n[1]!==g[1]).map(n=>`${n[2]} (${n[1]})`)),4));
  return {cat:"abbr",q:`Qual gás nobre é usado na distribuição abreviada do ${el.n} (Z = ${el.Z})?`,o,a:o.indexOf(`${g[2]} (${g[1]})`),
    x:`Usa-se o gás nobre <b>imediatamente anterior</b> ao elemento: o último da linha de cima. Para Z = ${el.Z} é o <b>${g[1]}</b> (Z = ${g[0]}).`,anim:{k:"cfg",z:el.Z}};
}
function qEner(){
  const el=pick(POOLG), cfg=config(el.Z), last=energetic(cfg), ok=part(last), used=cfg.filter(c=>c.e>0);
  const maxN=Math.max(...used.map(c=>c.n)), outer=used.find(c=>c.n===maxN);
  const cap=2*(2*last.l+1), c=[];
  c.push(part(outer)); if(last.e<cap) c.push(part(Object.assign({},last,{e:last.e+1}))); if(last.e>1) c.push(part(Object.assign({},last,{e:last.e-1})));
  used.filter(u=>u!==last).forEach(u=>c.push(part(u)));
  c.push(`${last.n}${LET[(last.l+1)%4]}${sup(last.e)}`);
  const o=shuffle(uniqOpts(ok,shuffle(c),4));
  const el2=E[el.Z-1];
  return {cat:"ener",q:`Qual é o subnível mais energético do ${el.n} (Z = ${el.Z})?`,o,a:o.indexOf(ok),
    x:`Na ordem das setas, o <b>último subnível preenchido</b> é o mais energético: <span class="mono">${strE(cfg)}</span> → <b>${ok}</b>. Bloco <b>${LET[last.l]}</b> → ${TIPO[tipoEl(el2)].toLowerCase()}.`,anim:{k:"cfg",z:el.Z}};
}
function qTipo(){
  const el=pick(E.filter(e=>(e.Z>=3&&e.Z<=56&&!EXC[e.Z])||[58,59,60,92].includes(e.Z))), t=tipoEl(el), cfg=config(el.Z), last=energetic(cfg);
  const O=[["repres","Representativo"],["transicao","De transição"],["interna","De transição interna"],["nobre","Gás nobre"]];
  const o=shuffle(O.map(x=>x[1])), ok=O.find(x=>x[0]===t)[1];
  return {cat:"tipo",q:`O ${el.n} (Z = ${el.Z}) é um elemento:`,o,a:o.indexOf(ok),
    x:`Subnível mais energético: <b>${part(last)}</b> (bloco ${LET[last.l]}). ${t==="nobre"?"Grupo 18: camada de valência completa.":t==="transicao"?"Bloco <b>d</b> (grupos 3 a 12): transição.":t==="interna"?"Bloco <b>f</b>: transição interna (lantanídeos/actinídeos).":"Bloco s ou p (grupos 1, 2 e 13 a 17): representativo."}`,anim:{k:"per",z:el.Z}};
}
function qPG(){
  const el=pick(POOLG), ok=`${el.per}º período, grupo ${el.grp}`, cfg=config(el.Z), r=groupRule(el,cfg);
  const c=[`${el.per}º período, grupo ${el.grp>1?el.grp-1:el.grp+1}`,`${el.per>1?el.per-1:el.per+1}º período, grupo ${el.grp}`,`${el.per+1}º período, grupo ${el.grp}`,`${el.grp<=7?el.grp:el.grp-10}º período, grupo ${el.per}`,`${el.per}º período, grupo ${el.grp+1}`];
  const o=shuffle(uniqOpts(ok,shuffle(c),4));
  const why=r.kind==="s"?`bloco s: grupo = ${r.a}`:r.kind==="p"?`bloco p: grupo = 10 + (${r.a} + ${r.b}) = ${r.grp}`:`bloco d: grupo = ${r.a} + ${r.b} = ${r.grp}`;
  return {cat:"pg",q:`Em que período e grupo da tabela está o ${el.n} (Z = ${el.Z})?`,o,a:o.indexOf(ok),
    x:`Distribuição: <span class="mono">${strL(cfg)}</span>. Maior camada n = ${el.per} → <b>período ${el.per}</b>; ${why} → <b>grupo ${el.grp}</b>.`,anim:{k:"per",z:el.Z}};
}
const MOLPOOL=["H2O","CO2","NaCl","NH3","H2SO4","CaCO3","Ca(OH)2","C6H12O6","Al2(SO4)3","HCl","NaOH","CH4","KMnO4","Mg(OH)2","Fe2O3","H3PO4","NaHCO3","(NH4)2SO4","Ca3(PO4)2","Al(OH)3"];
function qMol(){
  const f=pick(MOLPOOL), {rows,total}=calcMol(f,true), F=fmtFormula(f);
  const noCoef=r3(rows.reduce((a,r)=>a+r.m,0));
  let noPar=null; if(/\)\d/.test(f)){ try{ noPar=calcMol(f.replace(/\)(\d+)/g,")"),true).total; }catch(e){} }
  const c=[noCoef,noPar,total+rows[0].m,total-rows[rows.length-1].m,total+16,total+2].filter(v=>v!==null&&v>0&&v!==total).map(v=>fmt(v));
  const ok=fmt(total), o=shuffle(uniqOpts(ok,shuffle(c),4)).map(s=>s);
  return {cat:"mol",q:`Qual é a massa molar do ${F}? (use massas atômicas arredondadas, como em prova)`,o:o.map(s=>s+" g/mol"),a:o.indexOf(ok),
    x:`${rows.map(r=>`${r.sym}: ${r.k} × ${fmt(r.m)} = ${fmt(r.sub)}`).join(" · ")} → soma = <b>${ok} g/mol</b>.`,anim:{k:"mol",f}};
}
function qArr(){
  const v=pick(NUMS.filter(n=>n!==40)), d=pick([0,1,2]), ok=fmtFix(roundTo(v,d),d), tr=Math.floor(v*Math.pow(10,d))/Math.pow(10,d);
  const c=[fmtFix(tr,d),fmtFix(Math.ceil(v*Math.pow(10,d))/Math.pow(10,d),d),fmtFix(roundTo(v,d+1),d+1),d>0?fmtFix(roundTo(v,d-1),d-1):fmtFix(roundTo(v,1),1)];
  const o=shuffle(uniqOpts(ok,shuffle(c),4)), dg=nextDigit(v,d);
  return {cat:"arr",q:`Arredondando ${fmt(v)} para ${rndTxt(d)}, obtém-se:`,o,a:o.indexOf(ok),
    x:`Mantenha ${d===0?"o inteiro":rndTxt(d)} e olhe o <b>próximo algarismo</b>: ${dg}. ${dg>=5?"É 5 ou mais → o último algarismo mantido <b>aumenta 1</b>.":"É menor que 5 → o último algarismo mantido <b>não muda</b>."} Resultado: <b>${ok}</b>.`};
}
const STQ=[
 {cat:"abbr",q:"Para que serve o gás nobre na distribuição eletrônica abreviada?",o:["Representa, entre colchetes, os elétrons das camadas internas","Indica o número de prótons","Mostra a carga do íon","Substitui o subnível mais energético"],a:0,x:"Ex.: Na = <b>[Ne] 3s¹</b>. O [Ne] resume 1s² 2s² 2p⁶."},
 {cat:"nobre",q:"Os gases nobres pertencem a qual grupo da tabela periódica?",o:["Grupo 18 (8A)","Grupo 17 (7A)","Grupo 1 (1A)","Grupo 16 (6A)"],a:0,x:"Grupo 18: He, Ne, Ar, Kr, Xe, Rn."},
 {cat:"nobre",q:"Por que os gases nobres são pouco reativos?",o:["Têm a camada de valência completa","Têm muitos prótons","São todos líquidos","Têm apenas 1 elétron na valência"],a:0,x:"Camada de valência completa (ns² np⁶; o He tem 1s²): são muito estáveis."},
 {cat:"nobre",q:"Qual é a camada de valência dos gases nobres (exceto o hélio)?",o:["ns² np⁶","ns¹","ns² np¹","ns² (n−1)d¹⁰"],a:0,x:"São 8 elétrons na última camada (octeto). O He tem 2 (1s²)."},
 {cat:"nobre",q:"Qual destes é um gás nobre?",o:["Argônio (Ar)","Cloro (Cl)","Potássio (K)","Enxofre (S)"],a:0,x:"Ar (Z = 18): 1s² 2s² 2p⁶ 3s² 3p⁶."},
 {cat:"ener",q:"O subnível mais energético de um átomo é:",o:["O último subnível preenchido na ordem das setas (ordem de energia)","O que tem mais elétrons","O primeiro subnível preenchido","Sempre o subnível s"],a:0,x:"Ele define o bloco do elemento: s, p, d ou f."},
 {cat:"ener",q:"Nos elementos de transição, o subnível mais energético é do tipo:",o:["d","s","p","f"],a:0,x:"Bloco d: (n−1)d, grupos 3 a 12."},
 {cat:"ener",q:"Nos lantanídeos e actinídeos (transição interna), o subnível mais energético é do tipo:",o:["f","d","p","s"],a:0,x:"Bloco f: 4f (lantanídeos) e 5f (actinídeos)."},
 {cat:"ener",q:"O ferro (Z = 26) termina em 4s² 3d⁶. Qual é o seu subnível mais energético?",o:["3d⁶","4s²","4p⁶","3p⁶"],a:0,x:"Na ordem das setas, o 3d vem depois do 4s: o mais energético é o <b>3d⁶</b>, mesmo o 4s² sendo o mais externo."},
 {cat:"tipo",q:"Os elementos de transição ocupam quais grupos?",o:["3 a 12","1 e 2","13 a 17","18"],a:0,x:"Bloco d: grupos 3 a 12 (famílias B)."},
 {cat:"tipo",q:"Nos elementos representativos, o subnível mais energético é do tipo:",o:["s ou p","d","f","d ou f"],a:0,x:"Representativos: grupos 1, 2 e 13 a 17 (blocos s e p)."},
 {cat:"tipo",q:"Qual par é exceção ao diagrama de Pauling?",o:["Cr (4s¹ 3d⁵) e Cu (4s¹ 3d¹⁰)","Na e K","O e S","He e Ne"],a:0,x:"Subnível d meio cheio (d⁵) ou cheio (d¹⁰) é mais estável."},
 {cat:"cfg",q:"Quantos elétrons cabem no subnível d?",o:["10","6","14","2"],a:0,x:"s = 2 · p = 6 · d = 10 · f = 14."},
 {cat:"cfg",q:"Quantos elétrons cabem no subnível f?",o:["14","10","6","8"],a:0,x:"s = 2 · p = 6 · d = 10 · f = 14."},
 {cat:"cfg",q:"No diagrama de Pauling, qual subnível é preenchido logo depois do 4s?",o:["3d","4p","4d","3p"],a:0,x:"Ordem: … 3p → 4s → <b>3d</b> → 4p → 5s …"},
 {cat:"pg",q:"O período de um elemento corresponde:",o:["Ao número de camadas (maior n da distribuição)","Ao número de elétrons de valência","Ao número de nêutrons","À massa atômica"],a:0,x:"Fe: 4s² 3d⁶ → maior n = 4 → 4º período."},
 {cat:"pg",q:"No bloco p, o grupo é igual a:",o:["10 + (elétrons s + p da última camada)","Só os elétrons do subnível s","Só os elétrons do subnível d","O número de camadas"],a:0,x:"Ex.: P (3s² 3p³): 10 + (2 + 3) = grupo 15."},
 {cat:"mol",q:"1 mol de qualquer substância contém:",o:["6,02 × 10²³ partículas","6,02 × 10²⁰ partículas","1 g de matéria","18 g de matéria"],a:0,x:"É a constante de Avogadro."},
 {cat:"mol",q:"A massa molar da água (H₂O), com H = 1 e O = 16, é:",o:["18 g/mol","17 g/mol","16 g/mol","34 g/mol"],a:0,x:"2 × 1 + 16 = 18 g/mol."},
 {cat:"arr",q:"Na regra de arredondamento, quando o algarismo seguinte é 5 ou maior, o último algarismo mantido:",o:["Aumenta 1","Diminui 1","Não muda","Vira zero"],a:0,x:"Ex.: 74,6 → 75 (o seguinte é 6)."},
 {cat:"arr",q:"Arredondando 35,5 g/mol para o inteiro mais próximo, obtém-se:",o:["36","35","35,5","34"],a:0,x:"O algarismo seguinte é 5: arredonda para cima."}
];
const TCATS=[["all","Todos"],["cfg","Distribuição"],["abbr","Gás nobre"],["ener","Subnível"],["tipo","Tipos"],["pg","Período/grupo"],["mol","Massa molar"],["arr","Arredondar"]];
const TGEN={cfg:[qCfg],abbr:[qAbbr,qNoble],ener:[qEner],tipo:[qTipo],pg:[qPG],mol:[qMol],arr:[qArr]};
let tCat="all", tLen=10, TQ=null;
function makeDeck(cat,n){
  const cats=cat==="all"?Object.keys(TGEN):[cat], deck=[], seen=new Set(), usedSt=new Set(); let tries=0, ci=0;
  const order=shuffle(cats);
  while(deck.length<n&&tries<400){
    tries++; const c=order[ci++%order.length]; let q=null;
    const st=STQ.filter(s=>s.cat===c&&!usedSt.has(s.q));
    if(st.length&&Math.random()<.35){ const s=pick(st); usedSt.add(s.q); q=Object.assign({},s); }
    else q=pick(TGEN[c])();
    if(!q||seen.has(q.q)) continue; seen.add(q.q);
    if(!q.o) continue;
    if(!q.order){ const idx=shuffle(q.o.map((_,i)=>i)); q={...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a)}; }
    deck.push(q);
  }
  return deck;
}
function renderTrn(){
  if(TQ&&TQ.i<TQ.deck.length) return renderTQ();
  const cats=TCATS.map(([k,n])=>`<button data-c="${k}" class="${tCat===k?"on":""}">${n}</button>`).join("");
  $("v-trn").innerHTML=`<div class="card"><b>🎯 Treinar</b><p class="hint">As perguntas são <b>geradas na hora</b> (elementos e fórmulas diferentes a cada rodada) e sempre embaralhadas.</p>
    <h2 class="sec" style="margin-top:6px">Assunto</h2><div class="chips">${cats}</div>
    <h2 class="sec">Questões por rodada</h2><div class="seg">${[5,10,20].map(n=>`<button data-n="${n}" class="${tLen===n?"on":""}">${n}</button>`).join("")}</div>
    <button class="btn" id="tgo">▶ Começar</button></div>`;
  $("v-trn").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ tCat=b.dataset.c; renderTrn(); });
  $("v-trn").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ tLen=+b.dataset.n; renderTrn(); });
  $("tgo").onclick=()=>{ TQ={deck:makeDeck(tCat,tLen),i:0,ok:0,bad:0,sel:null,res:{}}; renderTQ(); };
}
function renderTQ(){
  if(TQ.i>=TQ.deck.length) return renderTRes();
  const q=TQ.deck[TQ.i], names=Object.fromEntries(TCATS);
  $("v-trn").innerHTML=`<div class="qhead"><button class="x" id="tx" aria-label="Sair">✕</button><div class="prog"><div class="qmeta"><span>Questão ${TQ.i+1} de ${TQ.deck.length}</span><span>✅ ${TQ.ok} &nbsp;❌ ${TQ.bad}</span></div><div class="bar"><i style="width:${Math.round(TQ.i/TQ.deck.length*100)}%"></i></div></div></div>
   <div class="card"><span class="pill">${names[q.cat]||q.cat}</span><div class="qtext">${q.q}</div>
   <div class="opts" id="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="lt">${"ABCDE"[k]}</span><span>${o}</span></button>`).join("")}</div><div id="fb"></div></div>`;
  $("tx").onclick=()=>{ if(confirm("Sair do treino?")){ TQ=null; renderTrn(); } };
  $("opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answerTQ(+b.dataset.k));
  if(TQ.sel!==null) answerTQ(TQ.sel,true);
}
function answerTQ(k,again){
  const q=TQ.deck[TQ.i], ok=k===q.a;
  if(!again){ if(TQ.sel!==null) return; TQ.sel=k; if(ok) TQ.ok++; else TQ.bad++; const r=TQ.res[q.cat]||(TQ.res[q.cat]={ok:0,n:0}); r.n++; if(ok) r.ok++; }
  $("opts").querySelectorAll(".opt").forEach((x,idx)=>{ x.disabled=true; if(idx===q.a) x.classList.add("ok"); else if(idx===k) x.classList.add("bad"); });
  const last=TQ.i+1>=TQ.deck.length;
  $("fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><div class="fbh"><span class="fbi">${ok?"✓":"✕"}</span><div><small>${ok?"Certo!":"Resposta correta"}</small><b>${q.o[q.a]}</b></div></div><div class="tip"><small>Explicação</small>${q.x}</div>
    ${q.anim?`<button class="btn vio mini" id="tanim">🎬 Ver a animação</button>`:""}<button class="btn dark" id="tnx">${last?"Ver resultado":"Próxima →"}</button></div>`;
  $("tnx").onclick=()=>{ TQ.i++; TQ.sel=null; renderTQ(); };
  if(q.anim) $("tanim").onclick=()=>{ const a=q.anim; if(a.k==="cfg") goCfg(a.z); else if(a.k==="per") goPer(a.z); else goMol(a.f); };
  if(!again) setTimeout(()=>{ const f=$("fb"); if(f) f.scrollIntoView({behavior:"smooth",block:"nearest"}); },80);
}
function renderTRes(){
  const n=TQ.ok+TQ.bad, acc=n?Math.round(TQ.ok/n*100):0, names=Object.fromEntries(TCATS);
  $("v-trn").innerHTML=`<div class="card result"><div class="trophy">${acc>=90?"🏆":acc>=70?"🎉":acc>=50?"👍":"💪"}</div><h2>Resultado</h2><p>${acc>=70?"Muito bem!":"Vale rever os assuntos abaixo."}</p>
   <div class="rs"><div style="background:var(--ok-soft);color:var(--ok)"><b>${TQ.ok}</b><span>Acertos</span></div><div style="background:var(--err-soft);color:var(--err)"><b>${TQ.bad}</b><span>Erros</span></div><div style="background:var(--bg)"><b>${acc}%</b><span>Aproveit.</span></div></div>
   <div style="text-align:left;margin:10px 0">${Object.entries(TQ.res).map(([c,r])=>`<div style="display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;padding:6px 0;border-bottom:1px dashed var(--line)"><span>${names[c]||c}</span><span>${r.ok}/${r.n}</span></div>`).join("")}</div>
   <button class="btn" id="tag">🔄 Nova rodada</button><button class="btn soft" id="thm">Mudar assunto</button></div>`;
  $("tag").onclick=()=>{ TQ={deck:makeDeck(tCat,tLen),i:0,ok:0,bad:0,sel:null,res:{}}; renderTQ(); };
  $("thm").onclick=()=>{ TQ=null; renderTrn(); };
}
